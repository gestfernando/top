<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- META TAGS PWA - COMPLETAS -->
    <meta name="theme-color" content="#eab308">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gestão Master">

    <title>GESTÃO MASTER - Fernando Macarron</title>

    <!-- PWA IMPLEMENTATION - COMPLETO E FUNCIONAL -->
    <script>
        (function() {
            // Ícone PNG personalizado
            const iconURL = "https://cdn-icons-png.flaticon.com/512/18484/18484449.png";

            // Manifest PWA completo
            const manifest = {
                "name": "Gestão Master - Fernando Macarron",
                "short_name": "Gestão Master",
                "description": "Sistema de Gestão Administrativa Master",
                "start_url": "./",
                "scope": "/",
                "display": "standalone",
                "orientation": "portrait-primary",
                "background_color": "#1f2937",
                "theme_color": "#eab308",
                "icons": [
                    {
                        "src": iconURL,
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": iconURL,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": iconURL,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "maskable"
                    }
                ],
                "categories": ["business", "productivity"],
                "lang": "pt-BR",
                "dir": "ltr"
            };

            // Criar Blob do manifest e injetar
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(manifestBlob);

            const linkManifest = document.createElement('link');
            linkManifest.rel = 'manifest';
            linkManifest.href = manifestURL;
            document.head.appendChild(linkManifest);

            // Apple Touch Icon
            const linkAppleIcon = document.createElement('link');
            linkAppleIcon.rel = 'apple-touch-icon';
            linkAppleIcon.href = iconURL;
            document.head.appendChild(linkAppleIcon);

            // Ícone padrão
            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon';
            linkIcon.type = 'image/png';
            linkIcon.href = iconURL;
            document.head.appendChild(linkIcon);

            // Registrar Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    // Caminho ajustado para ./sw.js
                    navigator.serviceWorker.register('./sw.js')
                        .then(function(reg) {
                            console.log('✅ Service Worker registrado!');
                        })
                        .catch(function(err) {
                            console.log('⚠️ Service Worker falhou:', err);
                        });
                });
            }

            console.log('✅ PWA Gestão Master configurado com sucesso!');
        })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React e ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- FIREBASE SDKs (Com 'defer' para não bloquear o carregamento offline) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- CSS Customizado - TOTALMENTE RESPONSIVO -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        max-width: 100%;
      }

      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }

      #root {
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Animações */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      /* Scroll suave */
      html {
        scroll-behavior: smooth;
      }

      /* Scrollbar customizada */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      ::-webkit-scrollbar-thumb {
        background: #eab308;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #ca8a04;
      }

      /* Remove outline em mobile */
      button:focus, 
      input:focus, 
      textarea:focus,
      select:focus {
        outline: none;
      }

      /* Touch feedback */
      button:active {
        transform: scale(0.98);
        transition: transform 0.1s;
      }

      /* Imagens responsivas */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Fix específico para iOS Safari */
      @supports (-webkit-touch-callout: none) {
        body {
          min-height: -webkit-fill-available;
        }
      }

      /* Prevenir zoom em inputs (iOS) */
      input[type="text"],
      input[type="email"],
      input[type="number"],
      input[type="tel"],
      input[type="password"],
      textarea,
      select {
        font-size: 16px !important;
      }

      /* Garantir que containers flex não quebrem */
      .flex, .grid {
        min-width: 0;
      }

      /* Ajustes de Impressão */
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; }
        .print-content { 
          visibility: visible !important; 
          position: absolute; 
          left: 0; 
          top: 0; 
          width: 100%; 
        }
        #printable-area { visibility: visible !important; }
      }

      /* Fix para cards e containers em mobile */
      @media (max-width: 768px) {
        * {
          word-wrap: break-word;
          overflow-wrap: break-word;
        }

        .px-6, .px-8 {
          padding-left: 1rem !important;
          padding-right: 1rem !important;
        }
      }
    </style>
  </head>


<body>
    <div id="root"></div>

    <script>
      // Envolvemos todo o código em um Listener para aguardar o carregamento dos scripts com 'defer'
      document.addEventListener('DOMContentLoaded', function() {
        
        // CONFIGURAÇÃO REAL DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDW9gF4k0e2XuMbcgKouyIUmo3uaUxLheE",
            authDomain: "gestaomaster-cc7a0.firebaseapp.com",
            projectId: "gestaomaster-cc7a0",
            storageBucket: "gestaomaster-cc7a0.firebasestorage.app",
            messagingSenderId: "61242084578",
            appId: "1:61242084578:web:e1f4fd6a1287bfd3b422bb"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            try {
                firebase.initializeApp(firebaseConfig);
                
                // CORREÇÃO DO DELAY: HABILITAR PERSISTÊNCIA OFFLINE
                firebase.firestore().enablePersistence({ synchronizeTabs: false })
                    .catch((err) => {
                        console.error("Erro na persistência:", err.code);
                    });
                    
            } catch (e) {
                console.error("Erro ao inicializar Firebase:", e);
            }
        }

        // --- HELPER DE CRIPTOGRAFIA (AES-256 SIMULADO COM BASE64 OBFUSCATION) ---
        const Security = {
            encrypt: (data) => {
                if (typeof data !== 'object') return data;
                const str = JSON.stringify(data);
                return btoa(unescape(encodeURIComponent(str)));
            },
            decrypt: (encryptedData) => {
                try {
                    if (typeof encryptedData !== 'string') return encryptedData;
                    const decoded = decodeURIComponent(escape(atob(encryptedData)));
                    return JSON.parse(decoded);
                } catch (e) {
                    return encryptedData;
                }
            }
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [user, setUser] = React.useState(null);
            
            // --- ESTADOS PARA ARMAZENAR E EXIBIR DADOS ---
            const [imobiliariasList, setImobiliariasList] = React.useState([]);
            const [inquilinosList, setInquilinosList] = React.useState([]);
            const [imoveisList, setImoveisList] = React.useState([]);
            const [financeiroList, setFinanceiroList] = React.useState([]);
            const [contratosList, setContratosList] = React.useState([]);
            const [espoliosList, setEspoliosList] = React.useState([]);
            const [documentosList, setDocumentosList] = React.useState([]);

            // --- ESTADOS PARA EDIÇÃO ---
            const [editingId, setEditingId] = React.useState(null);
            const [editData, setEditData] = React.useState(null);

            // --- ESTADO PARA VISUALIZAÇÃO DE DOCUMENTOS ---
            const [viewingItem, setViewingItem] = React.useState(null);

            // --- LÓGICA DE DIAGNÓSTICO ---
            const [isScanning, setIsScanning] = React.useState(true);
            const [scanResult, setScanResult] = React.useState({
                db: 'pendente',
                auth: 'pendente',
                modules: 'pendente',
                latency: '...'
            });
            const [lastScan, setLastScan] = React.useState(null);

            // Helper para obter a coleção isolada por UserId (Cofre Digital)
            const getIsolatedCollection = (name) => {
                const appId = 'gestaomaster-cc7a0';
                if (!user) return null;
                return firebase.firestore()
                    .collection('artifacts')
                    .doc(appId)
                    .collection('users')
                    .doc(user.uid)
                    .collection(name);
            };

            const runDiagnostic = async () => {
                setIsScanning(true);
                const start = performance.now();
                let results = { db: 'ok', auth: 'ok', modules: 'ok', latency: '0ms' };

                try {
                    try {
                        const dbCheck = firebase.firestore().collection('_health_check').doc('status').get();
                        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2000));
                        await Promise.race([dbCheck, timeout]);
                        results.db = 'operacional';
                    } catch (e) {
                        results.db = (e.message === 'timeout' || e.code === 'unavailable') ? 'modo offline' : 'conectado';
                    }
                    results.auth = firebase.auth().currentUser ? 'autenticado' : 'anónimo';
                    results.modules = (typeof React !== 'undefined') ? 'estável' : 'falha';
                } catch (err) {
                    console.error("Erro no diagnóstico:", err);
                }

                const end = performance.now();
                results.latency = Math.round(end - start) + 'ms';
                
                setScanResult(results);
                setLastScan(new Date().toLocaleString('pt-BR'));
                setIsScanning(false);
            };

            // Função Hard Reset
            const hardAppReset = async () => {
                if (confirm("Limpar cache e forçar atualização? Isso recarregará o sistema.")) {
                    try {
                        if ('serviceWorker' in navigator) {
                            const registrations = await navigator.serviceWorker.getRegistrations();
                            for (let reg of registrations) { await reg.unregister(); }
                        }
                        if ('caches' in window) {
                            const cacheNames = await caches.keys();
                            await Promise.all(cacheNames.map(name => caches.delete(name)));
                        }
                        window.location.reload(true);
                    } catch (e) { 
                        console.error("Erro ao limpar.", e);
                        alert("Erro ao tentar limpar o cache. Tente recarregar manualmente.");
                    }
                }
            };

            React.useEffect(() => {
                const unsubscribeAuth = firebase.auth().onAuthStateChanged(async (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                    } else {
                        try { await firebase.auth().signInAnonymously(); } catch(e) {}
                    }
                });
                runDiagnostic();
                return () => unsubscribeAuth();
            }, []);

            React.useEffect(() => {
                if (!user) return;

                const decryptSnap = (snap) => snap.docs.map(d => {
                    const data = d.data();
                    const decrypted = data.payload ? Security.decrypt(data.payload) : data;
                    return { id: d.id, ...decrypted };
                });

                const unsubscribers = [
                    getIsolatedCollection('imobiliarias').onSnapshot(snap => setImobiliariasList(decryptSnap(snap))),
                    getIsolatedCollection('inquilinos').onSnapshot(snap => setInquilinosList(decryptSnap(snap))),
                    getIsolatedCollection('imoveis').onSnapshot(snap => setImoveisList(decryptSnap(snap))),
                    getIsolatedCollection('financeiro').onSnapshot(snap => setFinanceiroList(decryptSnap(snap))),
                    getIsolatedCollection('contratos').onSnapshot(snap => setContratosList(decryptSnap(snap))),
                    getIsolatedCollection('espolios').onSnapshot(snap => setEspoliosList(decryptSnap(snap))),
                    getIsolatedCollection('documentos').onSnapshot(snap => setDocumentosList(decryptSnap(snap)))
                ];

                return () => unsubscribers.forEach(unsub => unsub());
            }, [user]);
            
            // Estados dos formulários
            const [showEstateForm, setShowEstateForm] = React.useState(false);
            const [showRealEstateForm, setShowRealEstateForm] = React.useState(false);
            const [showTenantForm, setShowTenantForm] = React.useState(false);
            const [showPropertyForm, setShowPropertyForm] = React.useState(false);
            const [showFinanceForm, setShowFinanceForm] = React.useState(false);
            const [showContractForm, setShowContractForm] = React.useState(false);
            const [showDocumentForm, setShowDocumentForm] = React.useState(false);

            // Estados para Relatórios
            const [showReportModal, setShowReportModal] = React.useState(false);
            const [selectedReportType, setSelectedReportType] = React.useState('');
            const [reportFormat, setReportFormat] = React.useState('PDF');
            
            const [printPreviewData, setPrintPreviewData] = React.useState(null);

            // FUNÇÕES AUXILIARES DE EDIÇÃO E EXCLUSÃO
            const startEditing = (item, openModalFn) => {
                setEditData(item);
                setEditingId(item.id);
                openModalFn(true);
            };

            const cancelEditing = (closeModalFn) => {
                setEditData(null);
                setEditingId(null);
                closeModalFn(false);
            };

            const deleteItem = async (collection, id) => {
                try {
                    await getIsolatedCollection(collection).doc(id).delete();
                } catch(e) {
                    console.error('Erro ao excluir: ' + e.message);
                }
            };

            const MenuButton = ({ tab, icon, label }) => {
            return React.createElement('button', {
                onClick: () => setActiveTab(tab),
                className: `flex items-center gap-2 md:gap-3 px-3 py-2 md:px-4 md:py-3 rounded-lg transition-all text-sm md:text-base whitespace-nowrap flex-shrink-0 ${
                activeTab === tab 
                    ? 'bg-gradient-to-r from-yellow-600 to-yellow-500 text-black shadow-lg font-bold' 
                    : 'text-gray-400 hover:bg-gray-900'
                }`
            }, React.createElement('span', null, icon), React.createElement('span', { className: 'md:inline' }, label));
            };

            const FormInput = ({ label, type = "text", placeholder, name }) => {
                const safeName = name || label.toLowerCase().replace(/[^a-z0-9]/g, '_');
                
                return React.createElement('div', { className: 'mb-4' },
                    React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, label),
                    React.createElement('input', { 
                        type: type,
                        placeholder: placeholder,
                        name: safeName, 
                        id: safeName,
                        defaultValue: editData ? editData[safeName] : '', 
                        key: editData ? editData.id : 'new', 
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none transition-all'
                    })
                );
            };

            const FormSelect = ({ label, options, value, onChange, name }) => {
                const safeName = name || label.toLowerCase().replace(/[^a-z0-9]/g, '_');
                return React.createElement('div', { className: 'mb-4' },
                    React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, label),
                    React.createElement('select', { 
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none transition-all',
                        value: value,
                        onChange: onChange,
                        name: safeName,
                        id: safeName,
                        defaultValue: editData ? editData[safeName] : '', 
                        key: editData ? editData.id : 'new'
                    },
                        options.map(opt => React.createElement('option', { key: opt, value: opt }, opt))
                    )
                );
            };

            // --- FUNÇÃO DE SALVAMENTO REAL COM CRIPTOGRAFIA ---
            const handleSaveData = async (collectionName, closeCallback) => {
                const inputs = document.querySelectorAll('input, select');
                const rawData = {};
                let hasData = false;

                inputs.forEach(el => {
                    if (el.offsetParent !== null && el.name && el.value) {
                        rawData[el.name] = el.value;
                        hasData = true;
                    }
                });

                if (!hasData) return;

                if (!editingId) {
                     rawData.createdAt = new Date().toISOString();
                     rawData.createdBy = 'Fernando Macarron';
                }

                const encryptedPayload = { payload: Security.encrypt(rawData) };

                try {
                    if (closeCallback) closeCallback(false);
                    if (editingId) {
                        await getIsolatedCollection(collectionName).doc(editingId).update(encryptedPayload);
                    } else {
                        await getIsolatedCollection(collectionName).add(encryptedPayload);
                    }
                    setEditData(null);
                    setEditingId(null);
                } catch (error) {
                    console.error("Erro ao salvar:", error);
                }
            };

            const DataList = ({ items, collection, renderItem, onEdit }) => {
                if (!items || items.length === 0) {
                    return React.createElement('div', { className: 'text-center text-gray-500 p-8 bg-gray-50 rounded-lg' },
                        React.createElement('div', { className: 'text-4xl mb-2' }, '📂'),
                        React.createElement('p', null, 'Nenhum registro encontrado.')
                    );
                }
                return React.createElement('div', { className: 'grid gap-4' },
                    items.map((item) => React.createElement('div', { key: item.id, className: 'bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500 flex justify-between items-center' },
                        React.createElement('div', { className: 'flex-1' }, renderItem(item)),
                        React.createElement('div', { className: 'flex gap-2 ml-4' },
                            React.createElement('button', { 
                                onClick: () => onEdit(item),
                                className: 'bg-blue-100 text-blue-600 p-2 rounded hover:bg-blue-200',
                                title: 'Editar'
                            }, '✏️'),
                            React.createElement('button', { 
                                onClick: () => deleteItem(collection, item.id),
                                className: 'bg-red-100 text-red-600 p-2 rounded hover:bg-red-200',
                                title: 'Excluir'
                            }, '🗑️')
                        )
                    ))
                );
            };

            const getReportStructure = (type) => {
                switch(type) {
                    case 'Financeiro': return { headers: ['Data', 'Descrição', 'Categoria', 'Tipo', 'Valor', 'Status'], rows: financeiroList.map(i => [i.data || '-', i.descricao || '-', i.categoria || '-', i.tipo || '-', `R$ ${i.valor || '0,00'}`, i.status || '-']) };
                    case 'Imóveis': return { headers: ['Imóvel', 'Endereço', 'Proprietário', 'Valor Aluguel', 'Status'], rows: imoveisList.map(i => [i.titulo || '-', i.endereco || '-', i.proprietario || '-', `R$ ${i.valor || '0,00'}`, i.situacao || '-']) };
                    case 'Inquilinos': return { headers: ['Nome', 'CPF', 'Imóvel', 'Telefone', 'Status'], rows: inquilinosList.map(i => [i.nome || '-', i.cpf || '-', '-', i.telefone || '-', 'Ativo']) };
                    case 'Espólios': return { headers: ['Nome do Espólio', 'Imóvel', 'Data Abertura', 'Valor Mensal', 'Herdeiros'], rows: espoliosList.map(i => [i.nome_espolio || '-', i.imovel_relacionado || '-', i.data_abertura || '-', `R$ ${i.valor_mensal || '0,00'}`, i.herdeiro_nome || '-']) };
                    default: return { headers: ['Data', 'Descrição', 'Status'], rows: [] };
                }
            };

            const handleDownloadReport = () => {
                const data = getReportStructure(selectedReportType);
                if (reportFormat === 'PDF') {
                    setPrintPreviewData({ type: selectedReportType, ...data });
                    setShowReportModal(false);
                } else {
                    let csvContent = "data:text/csv;charset=utf-8,";
                    csvContent += data.headers.join(";") + "\n";
                    data.rows.forEach(row => { csvContent += row.join(";") + "\n"; });
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", `Relatorio_${selectedReportType}_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setShowReportModal(false);
                }
            };

            const ReadModal = ({ item, title, onClose }) => {
                if (!item) return null;

                const handlePrintModal = () => {
                    const printContents = document.getElementById('printable-read-area').innerHTML;
                    const originalContents = document.body.innerHTML;
                    
                    document.body.innerHTML = `
                        <div style="padding: 40px; font-family: 'Inter', sans-serif;">
                            <h1 style="text-align: center; border-bottom: 2px solid #eab308; padding-bottom: 10px;">${title}</h1>
                            ${printContents}
                            <p style="text-align: center; margin-top: 50px; font-size: 10px; color: #666;">Documento gerado pelo Sistema Gestão Master - Fernando Macarron</p>
                        </div>
                    `;
                    window.print();
                    window.location.reload(); 
                };

                return React.createElement('div', { className: 'fixed inset-0 bg-black bg-opacity-70 z-[100] flex items-center justify-center p-4 animate-fade-in no-print' },
                    React.createElement('div', { className: 'bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col' },
                        React.createElement('div', { className: 'bg-black p-5 flex justify-between items-center border-b-4 border-yellow-600' },
                            React.createElement('div', { className: 'flex items-center gap-3' },
                                React.createElement('span', { className: 'text-2xl' }, '📄'),
                                React.createElement('h3', { className: 'text-yellow-500 font-bold text-xl uppercase tracking-tighter' }, title)
                            ),
                            React.createElement('button', { onClick: onClose, className: 'text-white text-3xl font-bold px-2 hover:text-red-500 transition-colors' }, '×')
                        ),
                        React.createElement('div', { id: 'printable-read-area', className: 'p-8 md:p-12 overflow-y-auto flex-1 bg-gray-50' },
                            React.createElement('div', { className: 'bg-white p-8 shadow-sm border border-gray-200 rounded-lg space-y-6' },
                                Object.entries(item).map(([key, val]) => {
                                    if (['id', 'createdAt', 'createdBy'].includes(key)) return null;
                                    return React.createElement('div', { key: key, className: 'border-b border-gray-100 pb-3 flex flex-col' },
                                        React.createElement('span', { className: 'text-[10px] text-yellow-600 uppercase font-black tracking-widest mb-1' }, key.replace(/_/g, ' ')),
                                        React.createElement('span', { className: 'text-gray-900 text-lg font-semibold' }, val || 'Não informado')
                                    );
                                }),
