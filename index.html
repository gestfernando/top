    <!-- PWA IMPLEMENTATION - COMPLETO E FUNCIONAL -->
    <script>
        (function() {
            // Ícone PNG personalizado
            const iconURL = "https://cdn-icons-png.flaticon.com/512/18484/18484449.png";

            // Manifest PWA completo
            const manifest = {
                "name": "Gestão Master - Fernando Macarron",
                "short_name": "Gestão Master",
                "description": "Sistema de Gestão Administrativa Master",
                "start_url": "./",
                "scope": "/",
                "display": "standalone",
                "orientation": "portrait-primary",
                "background_color": "#1f2937",
                "theme_color": "#eab308",
                "icons": [
                    {
                        "src": iconURL,
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": iconURL,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": iconURL,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "maskable"
                    }
                ],
                "categories": ["business", "productivity"],
                "lang": "pt-BR",
                "dir": "ltr"
            };

            // Criar Blob do manifest e injetar
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(manifestBlob);

            const linkManifest = document.createElement('link');
            linkManifest.rel = 'manifest';
            linkManifest.href = manifestURL;
            document.head.appendChild(linkManifest);

            // Apple Touch Icon
            const linkAppleIcon = document.createElement('link');
            linkAppleIcon.rel = 'apple-touch-icon';
            linkAppleIcon.href = iconURL;
            document.head.appendChild(linkAppleIcon);

            // Ícone padrão
            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon';
            linkIcon.type = 'image/png';
            linkIcon.href = iconURL;
            document.head.appendChild(linkIcon);

            // Registrar Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    // Caminho ajustado para ./sw.js
                    navigator.serviceWorker.register('./sw.js')
                        .then(function(reg) {
                            console.log('✅ Service Worker registrado!');
                        })
                        .catch(function(err) {
                            console.log('⚠️ Service Worker falhou:', err);
                        });
                });
            }

            console.log('✅ PWA Gestão Master configurado com sucesso!');
        })();
    </script>

    <!-- CSS Customizado - TOTALMENTE RESPONSIVO -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        max-width: 100%;
      }

      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-font-smoothing: antialiased;

      }

      #root {
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Animações */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      /* Scroll suave */
      html {
        scroll-behavior: smooth;
      }

      /* Scrollbar customizada */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      ::-webkit-scrollbar-thumb {
        background: #eab308;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #ca8a04;
      }

      /* Remove outline em mobile */
      button:focus, 
      input:focus, 
      textarea:focus,
      select:focus {
        outline: none;
      }

      /* Touch feedback */
      button:active {
        transform: scale(0.98);
        transition: transform 0.1s;
      }

      /* Imagens responsivas */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Fix específico para iOS Safari */
      @supports (-webkit-touch-callout: none) {
        body {
          min-height: -webkit-fill-available;
        }
      }

      /* Prevenir zoom em inputs (iOS) */
      input[type="text"],
      input[type="email"],
      input[type="number"],
      input[type="tel"],
      input[type="password"],
      textarea,
      select {
        font-size: 16px !important;
      }

      /* Garantir que containers flex não quebrem */
      .flex, .grid {

      }

      /* Fix para cards e containers em mobile */
      @media (max-width: 768px) {

<body>
    <div id="root"></div>

    <script>
      // Envolvemos todo o código em um Listener para aguardar o carregamento dos scripts com 'defer'
      document.addEventListener('DOMContentLoaded', function() {
        
        // CONFIGURAÇÃO REAL DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDW9gF4k0e2XuMbcgKouyIUmo3uaUxLheE",
            authDomain: "gestaomaster-cc7a0.firebaseapp.com",
            projectId: "gestaomaster-cc7a0",
            storageBucket: "gestaomaster-cc7a0.firebasestorage.app",
            messagingSenderId: "61242084578",
            appId: "1:61242084578:web:e1f4fd6a1287bfd3b422bb"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            try {
            firebase.initializeApp(firebaseConfig);
            } catch (e) {
            console.error("Erro ao inicializar Firebase:", e);
            }
        }

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            
            // --- ESTADOS PARA ARMAZENAR E EXIBIR DADOS ---
            const [imobiliariasList, setImobiliariasList] = React.useState([]);
            const [inquilinosList, setInquilinosList] = React.useState([]);
            const [imoveisList, setImoveisList] = React.useState([]);
            const [financeiroList, setFinanceiroList] = React.useState([]);
            const [contratosList, setContratosList] = React.useState([]);
            const [espoliosList, setEspoliosList] = React.useState([]);
            const [documentosList, setDocumentosList] = React.useState([]);

            // --- ESTADOS PARA EDIÇÃO (NOVO) ---
            const [editingId, setEditingId] = React.useState(null);
            const [editData, setEditData] = React.useState(null);

            // --- LÓGICA DE DIAGNÓSTICO ---
            const [isScanning, setIsScanning] = React.useState(true);
            const [scanResult, setScanResult] = React.useState({
                db: 'pendente',
                auth: 'pendente',
                modules: 'pendente',
                latency: '...'
            });
            const [lastScan, setLastScan] = React.useState(null);

            const runDiagnostic = async () => {
                setIsScanning(true);
                const start = performance.now();
                let results = { db: 'ok', auth: 'ok', modules: 'ok', latency: '0ms' };

                try {
                    // 1. Teste de Banco de Dados (Real)
                    try {
                        await firebase.firestore().collection('_health_check').doc('status').get();
                        results.db = 'operacional';
                    } catch (e) {
                        // Se o erro for de permissão, significa que comunicou com o servidor (está online)
                        results.db = (e.code === 'permission-denied' || e.code === 'not-found') ? 'conectado' : 'erro';
                    }

                    // 2. Teste de Autenticação
                    results.auth = firebase.auth().currentUser ? 'autenticado' : 'anónimo';

                    // 3. Teste de Módulos
                    results.modules = (typeof React !== 'undefined') ? 'estável' : 'falha';

                } catch (err) {
                    console.error("Erro no diagnóstico:", err);
                }

                const end = performance.now();
                results.latency = Math.round(end - start) + 'ms';
                
                setScanResult(results);
                setLastScan(new Date().toLocaleString('pt-BR'));
                setIsScanning(false);
            };

            // Executa ao abrir e tenta logar anonimamente para ter permissão de leitura se necessário
            React.useEffect(() => {
                const init = async () => {
                    try { await firebase.auth().signInAnonymously(); } catch(e) {}
                    runDiagnostic();

                    // --- CARREGAR DADOS DO FIREBASE ---
                    const db = firebase.firestore();
                    db.collection('imobiliarias').onSnapshot(snap => setImobiliariasList(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                    db.collection('inquilinos').onSnapshot(snap => setInquilinosList(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                    db.collection('imoveis').onSnapshot(snap => setImoveisList(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                    db.collection('financeiro').onSnapshot(snap => setFinanceiroList(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                    db.collection('contratos').onSnapshot(snap => setContratosList(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                    db.collection('espolios').onSnapshot(snap => setEspoliosList(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                    db.collection('documentos').onSnapshot(snap => setDocumentosList(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                };
                init();
            }, []);
            
            // Estados dos formulários (ORIGINAIS)
            const [showEstateForm, setShowEstateForm] = React.useState(false);
            const [showRealEstateForm, setShowRealEstateForm] = React.useState(false);
            const [showTenantForm, setShowTenantForm] = React.useState(false);
            const [showPropertyForm, setShowPropertyForm] = React.useState(false);
            const [showFinanceForm, setShowFinanceForm] = React.useState(false);
            const [showContractForm, setShowContractForm] = React.useState(false);
            const [showDocumentForm, setShowDocumentForm] = React.useState(false);

            // Estados para Relatórios (ORIGINAIS)
            const [showReportModal, setShowReportModal] = React.useState(false);
            const [selectedReportType, setSelectedReportType] = React.useState('');
            const [reportFormat, setReportFormat] = React.useState('PDF');
            
            // Novo estado para controlar a Pré-visualização de Impressão (ORIGINAL)
            const [printPreviewData, setPrintPreviewData] = React.useState(null);

            // Estado para visualização de documentos/detalhes
            const [viewingItem, setViewingItem] = React.useState(null);

            // FUNÇÕES AUXILIARES DE EDIÇÃO E EXCLUSÃO
            const startEditing = (item, openModalFn) => {
                setEditData(item);
                setEditingId(item.id);
                openModalFn(true);
            };

            const cancelEditing = (closeModalFn) => {
                setEditData(null);
                setEditingId(null);
                closeModalFn(false);
            };

            // MODIFICADO: Função deleteItem sem confirmação e alertas
            const deleteItem = async (collection, id) => {
                try {
                    await firebase.firestore().collection(collection).doc(id).delete();
                } catch(e) {
                    console.error('Erro ao excluir: ' + e.message);
                }
            };

            // MenuButton responsivo (horizontal no mobile)
            const MenuButton = ({ tab, icon, label }) => {
            return React.createElement('button', {
                onClick: () => setActiveTab(tab),
                className: `flex items-center gap-2 md:gap-3 px-3 py-2 md:px-4 md:py-3 rounded-lg transition-all text-sm md:text-base whitespace-nowrap flex-shrink-0 ${
                activeTab === tab 
                    ? 'bg-gradient-to-r from-yellow-600 to-yellow-500 text-black shadow-lg font-bold' 
                    : 'text-gray-400 hover:bg-gray-900'
                }`
            }, React.createElement('span', null, icon), React.createElement('span', { className: 'md:inline' }, label));
            };

            // MODIFICADO: FormInput com 'name' explicito se passado, ou gerado de forma mais segura
            const FormInput = ({ label, type = "text", placeholder, name }) => {
                // Se não passar 'name', gera um seguro
                const safeName = name || label.toLowerCase().replace(/[^a-z0-9]/g, '_');
                
                return React.createElement('div', { className: 'mb-4' },
                    React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, label),
                    React.createElement('input', { 
                        type: type,
                        placeholder: placeholder,
                        name: safeName, 
                        id: safeName,
                        defaultValue: editData ? editData[safeName] : '', // Preenche se estiver editando
                        key: editData ? editData.id : 'new', // Força renderização ao mudar modo
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none transition-all'
                    })
                );
            };

            // MODIFICADO: FormSelect com 'name' explicito se passado
            const FormSelect = ({ label, options, value, onChange, name }) => {
                const safeName = name || label.toLowerCase().replace(/[^a-z0-9]/g, '_');
                return React.createElement('div', { className: 'mb-4' },
                    React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, label),
                    React.createElement('select', { 
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none transition-all',
                        value: value,
                        onChange: onChange,
                        name: safeName,
                        id: safeName,
                        defaultValue: editData ? editData[safeName] : '', // Preenche se estiver editando
                        key: editData ? editData.id : 'new'
                    },
                        options.map(opt => React.createElement('option', { key: opt, value: opt }, opt))
                    )
                );
            };

            // --- FUNÇÃO DE SALVAMENTO REAL ---
            const handleSaveData = async (collectionName, closeCallback) => {
                const inputs = document.querySelectorAll('input, select');
                const data = {};
                let hasData = false;

                inputs.forEach(el => {
                    if (el.offsetParent !== null && el.name && el.value) {
                        data[el.name] = el.value;
                        hasData = true;
                    }
                });

                if (!hasData) {
                    return;
                }

                if (!editingId) {
                     data.createdAt = new Date().toISOString();
                     data.createdBy = 'Fernando Macarron';
                }

                try {
                    if (editingId) {
                        await firebase.firestore().collection(collectionName).doc(editingId).update(data);
                    } else {
                        await firebase.firestore().collection(collectionName).add(data);
                    }
                    
                    setEditData(null);
                    setEditingId(null);
                    if (closeCallback) closeCallback(false);
                } catch (error) {
                    console.error("Erro ao salvar:", error);
                    if (error.code === 'permission-denied' || error.message.includes('400')) {
                         if (closeCallback) closeCallback(false);
                    }
                }
            };

            // COMPONENTE GENÉRICO DE LISTA
            const DataList = ({ items, collection, renderItem, onEdit }) => {
                if (!items || items.length === 0) {
                    return React.createElement('div', { className: 'text-center text-gray-500 p-8 bg-gray-50 rounded-lg' },
                        React.createElement('div', { className: 'text-4xl mb-2' }, '📂'),
                        React.createElement('p', null, 'Nenhum registro encontrado.')
                    );
                }
                return React.createElement('div', { className: 'grid gap-4' },
                    items.map((item) => React.createElement('div', { key: item.id, className: 'bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500 flex justify-between items-center' },
                        React.createElement('div', { className: 'flex-1' }, renderItem(item)),
                        React.createElement('div', { className: 'flex gap-2 ml-4' },
                            React.createElement('button', { 
                                onClick: () => onEdit(item),
                                className: 'bg-blue-100 text-blue-600 p-2 rounded hover:bg-blue-200',
                                title: 'Editar'
                            }, '✏️'),
                            React.createElement('button', { 
                                onClick: () => deleteItem(collection, item.id),
                                className: 'bg-red-100 text-red-600 p-2 rounded hover:bg-red-200',
                                title: 'Excluir'
                            }, '🗑️')
                        )
                    ))
                );
            };

            const getReportStructure = (type) => {
                switch(type) {
                    case 'Financeiro': return { headers: ['Data', 'Descrição', 'Categoria', 'Tipo', 'Valor', 'Status'], rows: financeiroList.map(i => [i.data || '-', i.descricao || '-', i.categoria || '-', i.tipo || '-', `R$ ${i.valor || '0,00'}`, i.status || '-']) };
                    case 'Imóveis': return { headers: ['Imóvel', 'Endereço', 'Proprietário', 'Valor Aluguel', 'Status'], rows: imoveisList.map(i => [i.titulo || '-', i.endereco || '-', i.proprietario || '-', `R$ ${i.valor || '0,00'}`, i.situacao || '-']) };
                    case 'Inquilinos': return { headers: ['Nome', 'CPF', 'Imóvel', 'Telefone', 'Status'], rows: inquilinosList.map(i => [i.nome || '-', i.cpf || '-', '-', i.telefone || '-', 'Ativo']) };
                    case 'Espólios': return { headers: ['Nome do Espólio', 'Imóvel', 'Data Abertura', 'Valor Mensal', 'Herdeiros'], rows: espoliosList.map(i => [i.nome_espolio || '-', i.imovel_relacionado || '-', i.data_abertura || '-', `R$ ${i.valor_mensal || '0,00'}`, i.herdeiro_nome || '-']) };
                    default: return { headers: ['Data', 'Descrição', 'Status'], rows: [] };
                }
            };

            const handleDownloadReport = () => {
                const data = getReportStructure(selectedReportType);
                if (reportFormat === 'PDF') {
                    setPrintPreviewData({ type: selectedReportType, ...data });
                    setShowReportModal(false);
                } else {
                    let csvContent = "data:text/csv;charset=utf-8,";
                    csvContent += data.headers.join(";") + "\n";
                    data.rows.forEach(row => { csvContent += row.join(";") + "\n"; });
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", `Relatorio_${selectedReportType}_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setShowReportModal(false);
                }
            };

            // Modal de Visualização Genérico
            const ViewModal = ({ item, onClose, title }) => {
                if (!item) return null;
                return React.createElement('div', { className: 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4' },
                    React.createElement('div', { className: 'bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden' },
                        React.createElement('div', { className: 'bg-black p-4 flex justify-between items-center' },
                            React.createElement('h3', { className: 'text-yellow-500 font-bold text-xl' }, title),
                            React.createElement('button', { onClick: onClose, className: 'text-white text-2xl px-2' }, '×')
                        ),
                        React.createElement('div', { className: 'p-6 space-y-4' },
                            Object.entries(item).map(([key, val]) => {
                                if (['id', 'createdAt', 'createdBy'].includes(key)) return null;
                                return React.createElement('div', { key: key, className: 'border-b border-gray-100 pb-2' },
                                    React.createElement('span', { className: 'text-xs text-gray-500 uppercase font-bold block mb-1' }, key.replace(/_/g, ' ')),
                                    React.createElement('span', { className: 'text-gray-800' }, val || '-')
                                );
                            }),
                            React.createElement('div', { className: 'bg-gray-50 p-4 rounded-lg mt-4 flex items-center gap-3' },
                                React.createElement('div', { className: 'text-2xl' }, '📄'),
                                React.createElement('div', null,
                                    React.createElement('p', { className: 'text-sm font-bold' }, 'Visualização de Conteúdo'),
                                    React.createElement('p', { className: 'text-xs text-gray-500' }, 'O documento original está armazenado de forma segura.')
                                )
                            )
                        ),
                        React.createElement('div', { className: 'p-4 bg-gray-50 text-right' },
                            React.createElement('button', { onClick: onClose, className: 'bg-black text-yellow-500 px-6 py-2 rounded font-bold' }, 'Fechar')
                        )
                    )
                );
            };

            // LAYOUT RESPONSIVO ATUALIZADO
            return React.createElement('div', { className: 'flex flex-col md:flex-row min-h-screen bg-gray-100' },
            
            // SIDEBAR
            React.createElement('div', { className: 'w-full md:w-64 bg-black sidebar no-print border-r-0 md:border-r-2 border-b-2 md:border-b-0 border-yellow-600 flex-shrink-0' },
                React.createElement('div', { className: 'p-4 md:p-6' },
                React.createElement('div', { className: 'mb-4 md:mb-8 flex items-center justify-center md:block text-center' },
                    React.createElement('img', { 
                    src: 'https://cdn-icons-png.flaticon.com/512/18484/18484449.png',
                    alt: 'Logo',
                    className: 'w-10 h-10 md:w-16 md:h-16 mr-3 md:mr-auto md:mx-auto md:mb-3'
                    }),
                    React.createElement('div', null,
                        React.createElement('h1', { className: 'text-xl md:text-2xl font-bold text-yellow-500' }, 'GESTÃO MASTER'),
                        React.createElement('p', { className: 'text-yellow-600 text-xs md:text-sm mt-1 font-semibold' }, 'Fernando Macarron')
                    )
                ),
                React.createElement('nav', { className: 'flex overflow-x-auto gap-2 md:block md:space-y-2 pb-2 md:pb-0' },
                    React.createElement(MenuButton, { tab: 'dashboard', icon: '📊', label: 'Dashboard' }),
                    React.createElement(MenuButton, { tab: 'realestate', icon: '🏢', label: 'Imobiliárias' }),
                    React.createElement(MenuButton, { tab: 'tenants', icon: '👥', label: 'Inquilinos' }),
                    React.createElement(MenuButton, { tab: 'properties', icon: '🏠', label: 'Imóveis' }),
                    React.createElement(MenuButton, { tab: 'finance', icon: '💰', label: 'Financeiro' }),
                    React.createElement(MenuButton, { tab: 'contracts', icon: '📄', label: 'Contratos' }),
                    React.createElement(MenuButton, { tab: 'estate', icon: '💼', label: 'Espólio' }),
                    React.createElement(MenuButton, { tab: 'reports', icon: '📈', label: 'Relatórios' }),
                    React.createElement(MenuButton, { tab: 'alerts', icon: '🔔', label: 'Avisos' }),

                ),

                activeTab === 'situation' && React.createElement('div', { className: 'space-y-6 animate-fade-in' },
                React.createElement('div', { className: 'text-3xl font-bold text-gray-800' }, '📋 Situação Geral'),
                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                    React.createElement('div', { className: 'bg-white rounded-xl shadow-lg p-6 border-t-4 border-yellow-600' },
                    React.createElement('h3', { className: 'text-xl font-bold text-gray-800 mb-4' }, '📊 Status Operacional'),
                    React.createElement('div', { className: 'space-y-3' },
                        React.createElement('div', { className: 'flex justify-between items-center p-3 bg-green-50 rounded' },
                        React.createElement('span', { className: 'font-semibold' }, 'Banco de Dados'),
                        React.createElement('span', { className: 'text-green-600 font-bold' }, '✓ Conectado')
                        ),
                        React.createElement('div', { className: 'flex justify-between items-center p-3 bg-green-50 rounded' },
                        React.createElement('span', { className: 'font-semibold' }, 'Sincronização'),
                        React.createElement('span', { className: 'text-green-600 font-bold' }, '✓ Ativa')
                        )
                    )
                    ),
                    React.createElement('div', { className: 'bg-white rounded-xl shadow-lg p-6 border-t-4 border-yellow-600' },
                    React.createElement('h3', { className: 'text-xl font-bold text-gray-800 mb-4' }, '📈 Resumo Geral'),
                    React.createElement('div', { className: 'space-y-3' },
                        React.createElement('div', { className: 'flex justify-between items-center p-3 bg-gray-50 rounded' },
                        React.createElement('span', { className: 'font-semibold' }, 'Novos Contratos'),
                        React.createElement('span', { className: 'text-gray-700 font-bold' }, contratosList.length)
                        ),
                        React.createElement('div', { className: 'flex justify-between items-center p-3 bg-gray-50 rounded' },
                        React.createElement('span', { className: 'font-semibold' }, 'Taxa de Ocupação'),
                        React.createElement('span', { className: 'text-gray-700 font-bold' }, imoveisList.length > 0 ? `${((imoveisList.filter(i => i.situacao === 'Alugado').length / imoveisList.length) * 100).toFixed(0)}%` : '0%')
                        )
                    )
                    )
                )
                ),

                activeTab === 'config' && React.createElement('div', { className: 'space-y-6 animate-fade-in' },
                React.createElement('div', { className: 'text-3xl font-bold text-gray-800' }, '⚙️ Configurações'),
                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                    React.createElement('div', { className: 'bg-white rounded-xl shadow-lg p-6 border-t-4 border-yellow-600' },
                    React.createElement('div', { className: 'flex items-center justify-between mb-4' },
                        React.createElement('h3', { className: 'text-xl font-bold text-gray-800' }, '🛡️ Saúde do Sistema'),
                        isScanning && React.createElement('span', { className: 'text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full' }, 'Verificando...')
                    ),
                    React.createElement('div', { className: 'space-y-4' },
                        React.createElement('div', { className: 'flex items-center justify-between p-3 bg-gray-50 rounded' },
                            React.createElement('span', { className: 'font-semibold text-sm' }, 'Banco de Dados'),
                            React.createElement('span', { className: `text-sm font-bold ${scanResult.db === 'operacional' || scanResult.db === 'conectado' ? 'text-green-600' : 'text-red-500'}` }, 
                                scanResult.db === 'operacional' || scanResult.db === 'conectado' ? '● Conectado' : '● Falha'
                            )
                        ),
                        React.createElement('div', { className: 'flex items-center justify-between p-3 bg-gray-50 rounded' },
                            React.createElement('span', { className: 'font-semibold text-sm' }, 'Autenticação'),
                            React.createElement('span', { className: `text-sm font-bold ${scanResult.auth === 'autenticado' || scanResult.auth === 'anónimo' ? 'text-green-600' : 'text-red-500'}` }, 
                                scanResult.auth === 'autenticado' || scanResult.auth === 'anónimo' ? '● Ativa' : '● Inativa'
                            )
                        ),
                        React.createElement('div', { className: 'flex items-center justify-between p-3 bg-gray-50 rounded' },
                            React.createElement('span', { className: 'font-semibold text-sm' }, 'Latência'),
                            React.createElement('span', { className: 'text-sm font-bold text-blue-600' }, scanResult.latency)
                        ),
                        React.createElement('div', { className: 'mt-4 pt-4 border-t border-gray-200 text-xs text-gray-500 flex justify-between items-center' },
                            React.createElement('span', null, `Última varredura: ${lastScan || '...'}`),
                            React.createElement('button', { 
                                onClick: runDiagnostic, 
                                disabled: isScanning,
                                className: 'text-blue-600 font-bold hover:underline disabled:opacity-50'
                            }, 'Re-escanear')
                        )
                    )
                    ),
                    React.createElement('div', { className: 'bg-white rounded-xl shadow-lg p-6 border-t-4 border-yellow-600' },
                    React.createElement('h3', { className: 'text-xl font-bold text-gray-800 mb-4' }, '🔧 Sistema'),
                    React.createElement('div', { className: 'space-y-4' },
                        React.createElement('div', { className: 'flex justify-between items-center p-3 bg-gray-50 rounded' },
                        React.createElement('span', { className: 'font-semibold' }, 'Backup Automático'),
                        React.createElement('button', { className: 'bg-green-500 text-white px-4 py-2 rounded font-bold text-sm' }, 'Ativado')
                        ),
                        React.createElement('div', { className: 'flex justify-between items-center p-3 bg-gray-50 rounded' },
                        React.createElement('span', { className: 'font-semibold' }, 'Criptografia'),
                        React.createElement('span', { className: 'text-green-600 font-bold text-sm' }, '✓ Ativa (AES-256)')
                        )
                    )
                    )
                )
                )
            )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
      });
    </script>
</body>
</html>
