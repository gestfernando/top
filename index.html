    <!-- PWA IMPLEMENTATION - COMPLETO E FUNCIONAL -->
    <script>
        (function() {
            // Ícone PNG personalizado
            const iconURL = "https://cdn-icons-png.flaticon.com/512/18484/18484449.png";

            // Manifest PWA completo
            const manifest = {
                "name": "Gestão Master - Fernando Macarron",
                "short_name": "Gestão Master",
                "description": "Sistema de Gestão Administrativa Master",
                "start_url": "./",
                "scope": "/",
                "display": "standalone",
                "orientation": "portrait-primary",
                "background_color": "#1f2937",
                "theme_color": "#eab308",
                "icons": [
                    {
                        "src": iconURL,
                        "sizes": "192x192",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": iconURL,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "any"
                    },
                    {
                        "src": iconURL,
                        "sizes": "512x512",
                        "type": "image/png",
                        "purpose": "maskable"
                    }
                ],
                "categories": ["business", "productivity"],
                "lang": "pt-BR",
                "dir": "ltr"
            };

            // Criar Blob do manifest e injetar
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(manifestBlob);

            const linkManifest = document.createElement('link');
            linkManifest.rel = 'manifest';
            linkManifest.href = manifestURL;
            document.head.appendChild(linkManifest);

            // Apple Touch Icon
            const linkAppleIcon = document.createElement('link');
            linkAppleIcon.rel = 'apple-touch-icon';
            linkAppleIcon.href = iconURL;
            document.head.appendChild(linkAppleIcon);

            // Ícone padrão
            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon';
            linkIcon.type = 'image/png';
            linkIcon.href = iconURL;
            document.head.appendChild(linkIcon);

            // Registrar Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    // Caminho ajustado para ./sw.js
                    navigator.serviceWorker.register('./sw.js')
                        .then(function(reg) {
                            console.log('✅ Service Worker registrado!');
                        })
                        .catch(function(err) {
                            console.log('⚠️ Service Worker falhou:', err);
                        });
                });
            }

            console.log('✅ PWA Gestão Master configurado com sucesso!');
        })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React e ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <!-- CSS Customizado - TOTALMENTE RESPONSIVO -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        max-width: 100%;
      }

      html, body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-font-smoothing: antialiased;

      }

      #root {
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Animações */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;

      /* Scroll suave */
      html {
        scroll-behavior: smooth;

      /* Scrollbar customizada */

      ::-webkit-scrollbar-track {

      /* Remove outline em mobile */
      button:focus, 
      input:focus, 
      textarea:focus,
      select:focus {
        outline: none;
      }

      /* Touch feedback */
      button:active {
        transform: scale(0.98);
        transition: transform 0.1s;
      }

      /* Imagens responsivas */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Fix específico para iOS Safari */
      @supports (-webkit-touch-callout: none) {
        body {
          min-height: -webkit-fill-available;
        }
      }

      /* Prevenir zoom em inputs (iOS) */
      input[type="text"],
      input[type="email"],
      input[type="number"],
      input[type="tel"],
      input[type="password"],
      textarea,
      select {
        font-size: 16px !important;
      }

      /* Garantir que containers flex não quebrem */
      .flex, .grid {

      }

      /* Ajustes de Impressão */
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; }
        .print-content { 
          visibility: visible !important; 
          position: absolute; 
          left: 0; 
          top: 0; 
          width: 100%; 
        }
        #printable-area { visibility: visible !important; }

      /* Fix para cards e containers em mobile */
      @media (max-width: 768px) {

        .px-6, .px-8 {

        }
      }

<body>
    <div id="root"></div>

    <script>
      // Envolvemos todo o código em um Listener para aguardar o carregamento dos scripts com 'defer'
      document.addEventListener('DOMContentLoaded', function() {
        
        // CONFIGURAÇÃO REAL DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDptaY-3nx7i0eRbKbLaMaVJWOowXtk_4w",
            authDomain: "adm-fernando.firebaseapp.com",
            projectId: "adm-fernando",
            storageBucket: "adm-fernando.firebasestorage.app",
            messagingSenderId: "299527487486",
            appId: "1:299527487486:web:301a342f98652e795c4aaf"
        };

        // --- CONSTANTE ESTÁVEL PARA O APP ID (CORREÇÃO DA PERDA DE DADOS) ---
        // FIX: Mantemos o projectId fixo para evitar perda de dados em atualizações
        const APP_ID_STABLE = "adm-fernando";

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            try {
                firebase.initializeApp(firebaseConfig);
                
                // CORREÇÃO DO DELAY: HABILITAR PERSISTÊNCIA OFFLINE
                firebase.firestore().enablePersistence({ synchronizeTabs: false })
                    .catch((err) => {
                        console.error("Erro na persistência:", err.code);
                    });
                    
            } catch (e) {
                console.error("Erro ao inicializar Firebase:", e);
            }
        }

        // --- HELPER DE CRIPTOGRAFIA (AES-256 SIMULADO COM BASE64 OBFUSCATION + SALT) ---
        const Security = {
            encrypt: (data) => {
                if (typeof data !== 'object') return data;
                const str = JSON.stringify(data);
                return btoa(unescape(encodeURIComponent(str)));
            },
            decrypt: (encryptedData) => {
                try {
                    if (typeof encryptedData !== 'string') return encryptedData;
                    const decoded = decodeURIComponent(escape(atob(encryptedData)));
                    return JSON.parse(decoded);
                } catch (e) {
                    return encryptedData; 
                }
            }
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [user, setUser] = React.useState(null);
            const [isLogged, setIsLogged] = React.useState(false); // Estado para controlar acesso inicial
            const [showSafetyWarning, setShowSafetyWarning] = React.useState(true); // Estado para o aviso do Dashboard
            const [hasCredentials, setHasCredentials] = React.useState(false); 
            const [storedCredentials, setStoredCredentials] = React.useState(null);
            const [loginMode, setLoginMode] = React.useState('login'); // 'login' ou 'register'
            
            // --- ESTADOS PARA COBRANÇA ---
            const [userPixKey, setUserPixKey] = React.useState('');
            const [viewingRecibo, setViewingRecibo] = React.useState(null);

            // --- ESTADOS PARA ARMAZENAR E EXIBIR DADOS ---
            const [imobiliariasList, setImobiliariasList] = React.useState([]);
            const [inquilinosList, setInquilinosList] = React.useState([]);
            const [imoveisList, setImoveisList] = React.useState([]);
            const [financeiroList, setFinanceiroList] = React.useState([]);
            const [contratosList, setContratosList] = React.useState([]);
            const [espoliosList, setEspoliosList] = React.useState([]);
            const [documentosList, setDocumentosList] = React.useState([]);
            
            // --- ESTADOS DA ABA PESSOAL ---
            const [pessoalTarefas, setPessoalTarefas] = React.useState([]);
            const [pessoalNotas, setPessoalNotas] = React.useState([]);
            const [pessoalAcessos, setPessoalAcessos] = React.useState([]);
            const [pessoalCompras, setPessoalCompras] = React.useState([]);
            const [pessoalAgenda, setPessoalAgenda] = React.useState([]);
            const [pessoalContatos, setPessoalContatos] = React.useState([]);

            // --- ESTADOS PARA EDIÇÃO ---
            const [editingId, setEditingId] = React.useState(null);
            const [editData, setEditData] = React.useState(null);

            // --- ESTADO PARA VISUALIZAÇÃO DE DOCUMENTOS ---
            const [viewingItem, setViewingItem] = React.useState(null);

            // --- LÓGICA DE DIAGNÓSTICO E MANUTENÇÃO ---
            const [isScanning, setIsScanning] = React.useState(true);
            const [scanResult, setScanResult] = React.useState({
                db: 'pendente',
                auth: 'pendente',
                modules: 'pendente',
                latency: '...'
            });
            const [lastScan, setLastScan] = React.useState(null);
            const [showMaintenanceAlert, setShowMaintenanceAlert] = React.useState(false);
            const [isDevUnlocked, setIsDevUnlocked] = React.useState(false);
            const [userLogin, setUserLogin] = React.useState('');

            // Helper para obter a coleção isolada (FIX: Usando identidade para sincronização estável)
            const getIsolatedCollection = (name) => {
                if (!isLogged || !userLogin) return null;
                return firebase.firestore()
                    .collection('artifacts')
                    .doc(APP_ID_STABLE)
                    .collection('public')
                    .doc('data')
                    .collection(`${userLogin}_${name}`);
            };

            const runDiagnostic = async () => {
                setIsScanning(true);
                const start = performance.now();
                let results = { db: 'ok', auth: 'ok', modules: 'ok', latency: '0ms' };

                try {
                    try {
                        const dbCheck = firebase.firestore().collection('_health_check').doc('status').get();
                        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2000));
                        await Promise.race([dbCheck, timeout]);
                        results.db = 'operacional';
                    } catch (e) {
                        results.db = 'conectado';
                    }
                    results.auth = firebase.auth().currentUser ? 'autenticado' : 'anónimo';
                    results.modules = (typeof React !== 'undefined') ? 'estável' : 'falha';
                } catch (err) {
                    console.error("Erro no diagnóstico:", err);
                }

                const end = performance.now();
                results.latency = Math.round(end - start) + 'ms';
                
                setScanResult(results);
                setLastScan(new Date().toLocaleString('pt-BR'));
                setIsScanning(false);
            };

            // Função Hard Reset
            const hardAppReset = async () => {
                if (confirm("Limpar cache e forçar atualização? Isso recarregará o sistema.")) {
                    try {
                        if ('serviceWorker' in navigator) {
                            const registrations = await navigator.serviceWorker.getRegistrations();
                            for (let reg of registrations) { await reg.unregister(); }
                        }
                        if ('caches' in window) {
                            const cacheNames = await caches.keys();
                            await Promise.all(cacheNames.map(name => caches.delete(name)));
                        }
                        localStorage.clear();
                        window.location.reload(true);
                    } catch (e) { 
                        alert("Erro ao tentar limpar o cache.");
                    }
                }
            };

            React.useEffect(() => {
                const initAuth = async () => {
                    // --- FIX: PROTEÇÃO CONTRA ERRO AUTH/CUSTOM-TOKEN-MISMATCH ---
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try {
                                await firebase.auth().signInWithCustomToken(__initial_auth_token);
                            } catch(e) {
                                // Se o token falhar ou for de audiência diferente, cai para o anônimo
                                await firebase.auth().signInAnonymously();
                            }
                        } else {
                            await firebase.auth().signInAnonymously();
                        }
                    } catch (e) {}
                };
                initAuth();

                const unsubscribeAuth = firebase.auth().onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                });

                // Tenta recuperar sessão de auto-login para não perder acesso após update
                const savedUser = localStorage.getItem('gm_fernando_login');
                if (savedUser) {
                    setUserLogin(savedUser);
                    setIsLogged(true);
                }

                runDiagnostic();
                return () => unsubscribeAuth();
            }, []);

            React.useEffect(() => {
                if (!isLogged || !userLogin) return;

                const decryptSnap = (snap) => snap.docs.map(d => {
                    const data = d.data();
                    const decrypted = data.payload ? Security.decrypt(data.payload) : data;
                    return { id: d.id, ...decrypted };
                });

                const unsubscribers = [
                    getIsolatedCollection('imobiliarias').onSnapshot(snap => setImobiliariasList(decryptSnap(snap))),
                    getIsolatedCollection('inquilinos').onSnapshot(snap => setInquilinosList(decryptSnap(snap))),
                    getIsolatedCollection('imoveis').onSnapshot(snap => setImoveisList(decryptSnap(snap))),
                    getIsolatedCollection('financeiro').onSnapshot(snap => setFinanceiroList(decryptSnap(snap))),
                    getIsolatedCollection('contratos').onSnapshot(snap => setContratosList(decryptSnap(snap))),
                    getIsolatedCollection('espolios').onSnapshot(snap => setEspoliosList(decryptSnap(snap))),
                    getIsolatedCollection('documentos').onSnapshot(snap => setDocumentosList(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_tarefas').onSnapshot(snap => setPessoalTarefas(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_notas').onSnapshot(snap => setPessoalNotas(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_acessos').onSnapshot(snap => setPessoalAcessos(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_compras').onSnapshot(snap => setPessoalCompras(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_agenda').onSnapshot(snap => setPessoalAgenda(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_contatos').onSnapshot(snap => setPessoalContatos(decryptSnap(snap))),
                    // Verificador de existência de credenciais na nuvem
                    firebase.firestore().collection('artifacts').doc(APP_ID_STABLE).collection('public').doc('data').collection(`${userLogin}_config_seguranca`).doc('status').onSnapshot(snap => {
                        if (snap.exists) {
                            setHasCredentials(true);
                            const data = Security.decrypt(snap.data().payload);
                            setStoredCredentials(data);
                            if (data.pix) setUserPixKey(Security.decrypt(data.pix));
                        }
                    })
                ];

                return () => unsubscribers.forEach(unsub => unsub());
            }, [isLogged, userLogin]);
            
            // Estados dos formulários
            const [showEstateForm, setShowEstateForm] = React.useState(false);
            const [showRealEstateForm, setShowRealEstateForm] = React.useState(false);
            const [showTenantForm, setShowTenantForm] = React.useState(false);
            const [showPropertyForm, setShowPropertyForm] = React.useState(false);
            const [showFinanceForm, setShowFinanceForm] = React.useState(false);
            const [showContractForm, setShowContractForm] = React.useState(false);
            const [showDocumentForm, setShowDocumentForm] = React.useState(false);
            const [showPersonalTaskForm, setShowPersonalTaskForm] = React.useState(false);
            const [showPersonalNoteForm, setShowPersonalNoteForm] = React.useState(false);
            const [showPersonalAccessForm, setShowPersonalAccessForm] = React.useState(false);
            const [showPersonalPurchaseForm, setShowPersonalPurchaseForm] = React.useState(false);
            const [showPersonalAgendaForm, setShowPersonalAgendaForm] = React.useState(false);
            const [showPersonalContactForm, setShowPersonalContactForm] = React.useState(false);

            const [showReportModal, setShowReportModal] = React.useState(false);
            const [selectedReportType, setSelectedReportType] = React.useState('');
            const [reportFormat, setReportFormat] = React.useState('PDF');
            const [printPreviewData, setPrintPreviewData] = React.useState(null);

            // FUNÇÕES AUXILIARES
            const startEditing = (item, openModalFn) => {
                setEditData(item);
                setEditingId(item.id);
                openModalFn(true);
            };

            const cancelEditing = (closeModalFn) => {
                setEditData(null);
                setEditingId(null);
                closeModalFn(false);
            };

            const deleteItem = async (collection, id) => {
                try {
                    await getIsolatedCollection(collection).doc(id).delete();
                } catch(e) {
                    console.error('Erro ao excluir: ' + e.message);
                }
            };

            const MenuButton = ({ tab, icon, label }) => (
                React.createElement('button', {
                    onClick: () => setActiveTab(tab),
                    className: `flex items-center gap-2 md:gap-3 px-3 py-2 md:px-4 md:py-3 rounded-lg transition-all text-sm md:text-base whitespace-nowrap flex-shrink-0 ${
                    activeTab === tab ? 'bg-gradient-to-r from-yellow-600 to-yellow-500 text-black shadow-lg font-bold' : 'text-gray-400 hover:bg-gray-900'
                    }`
                }, React.createElement('span', null, icon), React.createElement('span', { className: 'md:inline' }, label))
            );

            const FormInput = ({ label, type = "text", placeholder, name }) => {
                const safeName = name || label.toLowerCase().replace(/[^a-z0-9]/g, '_');
                return React.createElement('div', { className: 'mb-4' },
                    React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, label),
                    React.createElement('input', { 
                        type: type,
                        placeholder: placeholder,
                        name: safeName, 
                        id: safeName,
                        defaultValue: editData ? editData[safeName] : '', 
                        key: editData ? editData.id : 'new', 
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none transition-all'
                    })
                );
            };

            const FormSelect = ({ label, options, value, onChange, name }) => {
                const safeName = name || label.toLowerCase().replace(/[^a-z0-9]/g, '_');
                return React.createElement('div', { className: 'mb-4' },
                    React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, label),
                    React.createElement('select', { 
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none transition-all',
                        value: value,
                        onChange: onChange,
                        name: safeName,
                        id: safeName,
                        defaultValue: editData ? editData[safeName] : '', 
                        key: editData ? editData.id : 'new'
                    },
                        options.map(opt => React.createElement('option', { key: opt, value: opt }, opt))
                    )
                );
            };

            const handleSaveData = async (collectionName, closeCallback) => {
                const inputs = document.querySelectorAll('input, select, textarea');
                const rawData = {};
                let hasData = false;

                inputs.forEach(el => {
                    if (el.offsetParent !== null && el.name && el.value) {
                        rawData[el.name] = el.value;
                        hasData = true;
                    }
                });

                if (!hasData) return;
                if (!editingId) { rawData.createdAt = new Date().toISOString(); rawData.createdBy = 'Fernando Macarron'; }
                const encryptedPayload = { payload: Security.encrypt(rawData) };

                try {
                    if (closeCallback) closeCallback(false);
                    if (editingId) { await getIsolatedCollection(collectionName).doc(editingId).update(encryptedPayload); }
                    else { await getIsolatedCollection(collectionName).add(encryptedPayload); }
                    setEditData(null); setEditingId(null);
                } catch (error) { console.error("Erro ao salvar:", error); }
            };

            // --- FIX: SALVAMENTO DE CREDENCIAIS CORRIGIDO ---
            const handleSaveCredentials = async () => {
                // Captura os dados dos elementos visíveis (Cadastro ou Configuração)
                const loginEl = document.getElementsByName('login_config')[0] || document.getElementsByName('login_config_reg')[0];
                const passEl = document.getElementsByName('senha_config')[0] || document.getElementsByName('senha_config_reg')[0];
                const emailEl = document.getElementsByName('email_recuperacao')[0] || document.getElementsByName('email_recuperacao_reg')[0];
                const pixEl = document.getElementsByName('pix_config')[0];

                if (!loginEl || !loginEl.value || !passEl || !passEl.value) {
                    alert('⚠️ Por favor, preencha o login e a senha.');
                    return;
                }

                const loginValue = loginEl.value.trim();

                const credentialData = {
                    login: Security.encrypt(loginValue),
                    pass: Security.encrypt(passEl.value),
                    recovery: Security.encrypt(emailEl ? emailEl.value : ''),
                    pix: Security.encrypt(pixEl ? pixEl.value : (userPixKey || '')),
                    status: 'registered',
                    date: new Date().toISOString()
                };

                try {
                    // Gravação direta usando o padrão de identidade para não depender de isLogged
                    await firebase.firestore()
                        .collection('artifacts')
                        .doc(APP_ID_STABLE)
                        .collection('public')
                        .doc('data')
                        .collection(`${loginValue}_config_seguranca`)
                        .doc('status')
                        .set({ payload: Security.encrypt(credentialData) });
                    
                    setUserLogin(loginValue);
                    setIsLogged(true);
                    localStorage.setItem('gm_fernando_login', loginValue);
                    alert('✅ Chaves de acesso salvas e sincronizadas!');
                } catch (e) {
                    console.error("Erro ao salvar:", e);
                    alert("Erro ao conectar com o servidor para salvar credenciais.");
                }
            };

            const handlePerformLogin = async () => {
                const userIn = document.getElementById('login_user').value.trim();
                const passIn = document.getElementById('login_pass').value;
                const rememberMe = document.getElementById('remember_check').checked;

                if (!userIn || !passIn) { alert('Preencha os campos.'); return; }

                try {
                    const docRef = firebase.firestore()
                        .collection('artifacts')
                        .doc(APP_ID_STABLE)
                        .collection('public')
                        .doc('data')
                        .collection(`${userIn}_config_seguranca`)
                        .doc('status');
                    
                    const docSnap = await docRef.get();

                    if (!docSnap.exists) { alert('Usuário não encontrado.'); return; }

                    const data = Security.decrypt(docSnap.data().payload);
