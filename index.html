    <script>
        (function() {
            const iconURL = "https://cdn-icons-png.flaticon.com/512/18484/18484449.png";
            const manifest = {
                "name": "Gestão Master - Fernando Macarron",
                "short_name": "Gestão Master",
                "description": "Sistema de Gestão Administrativa Master",
                "start_url": "./",
                "scope": "/",
                "display": "standalone",
                "orientation": "portrait-primary",
                "background_color": "#1f2937",
                "theme_color": "#eab308",
                "icons": [
                    { "src": iconURL, "sizes": "192x192", "type": "image/png", "purpose": "any" },
                    { "src": iconURL, "sizes": "512x512", "type": "image/png", "purpose": "any" },
                    { "src": iconURL, "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
                ],
                "categories": ["business", "productivity"],
                "lang": "pt-BR",
                "dir": "ltr"
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(manifestBlob);
            const linkManifest = document.createElement('link');
            linkManifest.rel = 'manifest';
            linkManifest.href = manifestURL;
            document.head.appendChild(linkManifest);
            const linkAppleIcon = document.createElement('link');
            linkAppleIcon.rel = 'apple-touch-icon';
            linkAppleIcon.href = iconURL;
            document.head.appendChild(linkAppleIcon);
            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon';
            linkIcon.type = 'image/png';
            linkIcon.href = iconURL;
            document.head.appendChild(linkIcon);
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('./sw.js').then(function(reg) {
                        console.log('✅ Service Worker registrado!');
                    }).catch(function(err) {
                        console.log('⚠️ Service Worker falhou:', err);
                    });
                });
            }
        })();
    </script>

<body>
    <div id="root"></div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const firebaseConfig = {
            apiKey: "AIzaSyDW9gF4k0e2XuMbcgKouyIUmo3uaUxLheE",
            authDomain: "gestaomaster-cc7a0.firebaseapp.com",
            projectId: "gestaomaster-cc7a0",
            storageBucket: "gestaomaster-cc7a0.firebasestorage.app",
            messagingSenderId: "61242084578",
            appId: "1:61242084578:web:e1f4fd6a1287bfd3b422bb"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            firebase.firestore().enablePersistence({ synchronizeTabs: false }).catch(() => {});
        }

        const Security = {
            encrypt: (data) => {
                if (!data) return '';
                const str = typeof data === 'object' ? JSON.stringify(data) : String(data);
                return btoa(unescape(encodeURIComponent(str)));
            },
            decrypt: (encryptedData) => {
                try {
                    if (!encryptedData) return '';
                    const decoded = decodeURIComponent(escape(atob(encryptedData)));
                    return decoded.startsWith('{') || decoded.startsWith('[') ? JSON.parse(decoded) : decoded;
                } catch (e) { return encryptedData; }
            }
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [user, setUser] = React.useState(null);
            const [isLogged, setIsLogged] = React.useState(false);
            const [loginUser, setLoginUser] = React.useState(localStorage.getItem('gm_login') || '');
            const [showSafetyWarning, setShowSafetyWarning] = React.useState(true);
            const [hasCredentials, setHasCredentials] = React.useState(true);
            const [userPixKey, setUserPixKey] = React.useState('');
            const [viewingRecibo, setViewingRecibo] = React.useState(null);
            
            const [firstAccessMode, setFirstAccessMode] = React.useState(false);
            const [tempPassword, setTempPassword] = React.useState('');

            const [imobiliariasList, setImobiliariasList] = React.useState([]);
            const [inquilinosList, setInquilinosList] = React.useState([]);
            const [imoveisList, setImoveisList] = React.useState([]);
            const [financeiroList, setFinanceiroList] = React.useState([]);
            const [contratosList, setContratosList] = React.useState([]);
            const [espoliosList, setEspoliosList] = React.useState([]);
            const [documentosList, setDocumentosList] = React.useState([]);
            const [pessoalTarefas, setPessoalTarefas] = React.useState([]);
            const [pessoalNotas, setPessoalNotas] = React.useState([]);
            const [pessoalAcessos, setPessoalAcessos] = React.useState([]);
            const [pessoalCompras, setPessoalCompras] = React.useState([]);
            const [pessoalAgenda, setPessoalAgenda] = React.useState([]);
            const [pessoalContatos, setPessoalContatos] = React.useState([]);

            const [editingId, setEditingId] = React.useState(null);
            const [editData, setEditData] = React.useState(null);
            const [viewingItem, setViewingItem] = React.useState(null);
            const [isScanning, setIsScanning] = React.useState(true);
            const [scanResult, setScanResult] = React.useState({ db: 'pendente', auth: 'pendente', modules: 'pendente', latency: '...' });
            const [lastScan, setLastScan] = React.useState(null);
            const [showMaintenanceAlert, setShowMaintenanceAlert] = React.useState(false);

            // CORREÇÃO DE PERMISSÕES (RULE 1): Caminho obrigatório para evitar FirebaseError
            const getIsolatedCollection = (name) => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'gestaomaster-cc7a0';
                if (!loginUser) return null;
                // Caminho rigoroso: artifacts -> appId -> public -> data -> NomeDaColeção
                return firebase.firestore()
                    .collection('artifacts').doc(appId)
                    .collection('public').doc('data')
                    .collection(`user_data_${loginUser}_${name}`);
            };

            const runDiagnostic = async () => {
                setIsScanning(true);
                const start = performance.now();
                let results = { db: 'conectado', auth: 'ativo', modules: 'estável', latency: '0ms' };
                try {
                    await firebase.firestore().collection('_health').doc('status').get();
                } catch (e) {}
                results.latency = Math.round(performance.now() - start) + 'ms';
                setScanResult(results);
                setLastScan(new Date().toLocaleString('pt-BR'));
                setIsScanning(false);
            };

            const hardAppReset = async () => {
                if (confirm("Limpar cache e forçar atualização?")) {
                    localStorage.clear();
                    if ('serviceWorker' in navigator) {
                        const regs = await navigator.serviceWorker.getRegistrations();
                        for (let r of regs) await r.unregister();
                    }
                    window.location.reload(true);
                }
            };

            const resetCloudCredentials = async () => {
                if (confirm("⚠️ ATENÇÃO: Isso excluirá permanentemente seu login e senha da nuvem. O sistema será reiniciado e você precisará criar um novo acesso. Deseja continuar?")) {
                    try {
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gestaomaster-cc7a0';
                        await firebase.firestore()
                            .collection('artifacts').doc(appId)
                            .collection('public').doc('data')
                            .collection('auth_registry').doc(loginUser).delete();
                        
                        localStorage.clear();
                        window.location.reload(true);
                    } catch (e) {
                        console.error("Erro ao resetar:", e);
                    }
                }
            };

            const handleLoginAction = async () => {
                const loginInput = document.getElementById('login_field').value.trim();
                const passInput = document.getElementById('pass_field').value.trim();

                if (!loginInput || !passInput) {
                    return;
                }

                try {
                    // Garante autenticação anônima antes da leitura (RULE 3)
                    if (!firebase.auth().currentUser) {
                        await firebase.auth().signInAnonymously();
                    }

                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'gestaomaster-cc7a0';
                    const regDoc = await firebase.firestore()
                        .collection('artifacts').doc(appId)
                        .collection('public').doc('data')
                        .collection('auth_registry').doc(loginInput).get();

                    if (!regDoc.exists) {
                        setTempPassword(passInput);
                        setFirstAccessMode(true);
                        return;
                    }

                    const data = regDoc.data();
                    if (Security.decrypt(data.pass) === passInput) {
                        setLoginUser(loginInput);
                        localStorage.setItem('gm_login', loginInput);
                        setIsLogged(true);
                    } else {
                        alert("❌ Senha incorreta.");
                    }
                } catch (e) {
                    console.error("Erro no login:", e);
                    alert("Erro de conexão com o banco de dados.");
                }
            };
            
            const confirmFirstAccess = async () => {
                const loginInput = document.getElementById('login_field').value.trim();
                const passInput = tempPassword;

                const data = { 
                    pass: Security.encrypt(passInput), 
                    date: new Date().toISOString(),
                    status: 'active'
                };

                try {
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'gestaomaster-cc7a0';
                    await firebase.firestore()
                        .collection('artifacts').doc(appId)
                        .collection('public').doc('data')
                        .collection('auth_registry').doc(loginInput).set(data);

                    setLoginUser(loginInput);
                    localStorage.setItem('gm_login', loginInput);
                    setIsLogged(true);
                } catch (e) {
                    console.error("Erro no cadastro:", e);
                    alert("Erro ao salvar cadastro. Tente outro nome de usuário.");
                }
            };

            React.useEffect(() => {
                const initAuth = async () => {
                    try {
                        await firebase.auth().signInAnonymously();
                        setUser(firebase.auth().currentUser);
                    } catch(e) {}
                };
                initAuth();
                runDiagnostic();
            }, []);

            React.useEffect(() => {
                if (!isLogged || !loginUser || !user) return;

                const decryptSnap = (snap) => snap.docs.map(d => {
                    const data = d.data();
                    const decrypted = data.payload ? Security.decrypt(data.payload) : data;
                    return { id: d.id, ...decrypted };
                });

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'gestaomaster-cc7a0';
                const unsubscribers = [
                    getIsolatedCollection('imobiliarias').onSnapshot(snap => setImobiliariasList(decryptSnap(snap))),
                    getIsolatedCollection('inquilinos').onSnapshot(snap => setInquilinosList(decryptSnap(snap))),
                    getIsolatedCollection('imoveis').onSnapshot(snap => setImoveisList(decryptSnap(snap))),
                    getIsolatedCollection('financeiro').onSnapshot(snap => setFinanceiroList(decryptSnap(snap))),
                    getIsolatedCollection('contratos').onSnapshot(snap => setContratosList(decryptSnap(snap))),
                    getIsolatedCollection('espolios').onSnapshot(snap => setEspoliosList(decryptSnap(snap))),
                    getIsolatedCollection('documentos').onSnapshot(snap => setDocumentosList(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_tarefas').onSnapshot(snap => setPessoalTarefas(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_notas').onSnapshot(snap => setPessoalNotas(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_acessos').onSnapshot(snap => setPessoalAcessos(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_compras').onSnapshot(snap => setPessoalCompras(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_agenda').onSnapshot(snap => setPessoalAgenda(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_contatos').onSnapshot(snap => setPessoalContatos(decryptSnap(snap))),
                    firebase.firestore()
                        .collection('artifacts').doc(appId)
                        .collection('public').doc('data')
                        .collection('auth_registry').doc(loginUser).onSnapshot(doc => {
                            if (doc.exists) {
                                setHasCredentials(true);
                                const data = doc.data();
                                if (data.pix) setUserPixKey(Security.decrypt(data.pix));
                            } else {
                                setHasCredentials(false);
                            }
                        })
                ];
                return () => unsubscribers.forEach(u => u());
            }, [isLogged, loginUser, user]);

            const [showEstateForm, setShowEstateForm] = React.useState(false);
            const [showRealEstateForm, setShowRealEstateForm] = React.useState(false);
            const [showTenantForm, setShowTenantForm] = React.useState(false);
            const [showPropertyForm, setShowPropertyForm] = React.useState(false);
            const [showFinanceForm, setShowFinanceForm] = React.useState(false);
            const [showContractForm, setShowContractForm] = React.useState(false);
            const [showDocumentForm, setShowDocumentForm] = React.useState(false);
            const [showPersonalTaskForm, setShowPersonalTaskForm] = React.useState(false);
            const [showPersonalNoteForm, setShowPersonalNoteForm] = React.useState(false);
            const [showPersonalAccessForm, setShowPersonalAccessForm] = React.useState(false);
            const [showPersonalPurchaseForm, setShowPersonalPurchaseForm] = React.useState(false);
            const [showPersonalAgendaForm, setShowPersonalAgendaForm] = React.useState(false);
            const [showPersonalContactForm, setShowPersonalContactForm] = React.useState(false);
            const [showReportModal, setShowReportModal] = React.useState(false);
            const [selectedReportType, setSelectedReportType] = React.useState('');
            const [reportFormat, setReportFormat] = React.useState('PDF');
            const [printPreviewData, setPrintPreviewData] = React.useState(null);

            const startEditing = (item, openModalFn) => { setEditData(item); setEditingId(item.id); openModalFn(true); };
            const cancelEditing = (closeModalFn) => { setEditData(null); setEditingId(null); closeModalFn(false); };
            const deleteItem = async (coll, id) => { try { await getIsolatedCollection(coll).doc(id).delete(); } catch(e) {} };

            const handleSaveData = async (collectionName, closeCallback) => {
                const inputs = document.querySelectorAll('input, select, textarea');
                const rawData = {};
                let hasData = false;
                inputs.forEach(el => {
                    if (el.offsetParent !== null && el.name) {
                        rawData[el.name] = el.value;
                        hasData = true;
                    }
                });
                if (!hasData) return;
                if (!editingId) { rawData.createdAt = new Date().toISOString(); }
                const encryptedPayload = { payload: Security.encrypt(rawData) };
                try {
                    if (closeCallback) closeCallback(false);
                    if (editingId) { await getIsolatedCollection(collectionName).doc(editingId).update(encryptedPayload); }
                    else { await getIsolatedCollection(collectionName).add(encryptedPayload); }
                    setEditData(null); setEditingId(null);
                } catch (e) {}
            };

            const handleSaveCredentials = async () => {
                const pass = document.getElementsByName('senha_config')[0].value;
                const email = document.getElementsByName('email_recuperacao')[0].value;
                const pix = document.getElementsByName('pix_config')[0].value;
                if (!pass) { return; }
                const data = { pass: Security.encrypt(pass), recovery: Security.encrypt(email), pix: Security.encrypt(pix), date: new Date().toISOString() };
                try {
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'gestaomaster-cc7a0';
                    await firebase.firestore()
                        .collection('artifacts').doc(appId)
                        .collection('public').doc('data')
                        .collection('auth_registry').doc(loginUser).set(data);
                    alert("✅ Dados sincronizados com sucesso!");
                } catch(e) {}
            };

            const MenuButton = ({ tab, icon, label }) => (
                React.createElement('button', {
                    onClick: () => setActiveTab(tab),
                    className: `flex items-center gap-3 px-4 py-3 rounded-lg transition-all flex-shrink-0 ${activeTab === tab ? 'bg-gradient-to-r from-yellow-600 to-yellow-500 text-black shadow-lg font-bold' : 'text-gray-400 hover:bg-gray-900'}`
                }, React.createElement('span', null, icon), React.createElement('span', null, label))
            );

            const FormInput = ({ label, type = "text", placeholder, name }) => {
                const safeName = name || label.toLowerCase().replace(/[^a-z0-9]/g, '_');
                return React.createElement('div', { className: 'mb-4' },
                    React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, label),
                    React.createElement('input', { 
                        type, placeholder, name: safeName, id: safeName, 
                        defaultValue: editData ? editData[safeName] : '', 
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none'
                    })
                );
            };

            const FormSelect = ({ label, options, name }) => {
                const safeName = name || label.toLowerCase().replace(/[^a-z0-9]/g, '_');
                return React.createElement('div', { className: 'mb-4' },
                    React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, label),
                    React.createElement('select', { 
                        name: safeName, id: safeName, defaultValue: editData ? editData[safeName] : '',
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none'
                    }, options.map(o => React.createElement('option', { key: o, value: o }, o)))
                );
            };

            const ReciboModal = ({ item, onClose }) => (
                React.createElement('div', { className: 'fixed inset-0 bg-black bg-opacity-70 z-[100] flex items-center justify-center p-4 animate-fade-in no-print' },
                    React.createElement('div', { className: 'bg-white rounded-xl shadow-2xl w-full max-w-lg' },
                        React.createElement('div', { className: 'bg-yellow-600 p-4 flex justify-between items-center' },
                            React.createElement('h3', { className: 'text-white font-bold' }, '🎫 Recibo Digital'),
                            React.createElement('button', { onClick: onClose, className: 'text-white text-2xl' }, '×')
                        ),
                        React.createElement('div', { className: 'p-6' },
                            React.createElement('div', { className: 'text-center border-b pb-4 mb-4' }, React.createElement('h1', { className: 'text-2xl font-black' }, 'RECIBO')),
                            React.createElement('div', { className: 'space-y-2' },
                                React.createElement('p', null, React.createElement('strong', null, 'Valor: '), `R$ ${item.valor}`),
                                React.createElement('p', null, React.createElement('strong', null, 'Referente: '), item.descricao),
                                React.createElement('p', null, React.createElement('strong', null, 'Vencimento: '), item.data),
                                React.createElement('div', { className: 'bg-gray-100 p-3 rounded mt-4 text-center' }, React.createElement('p', { className: 'text-xs uppercase font-bold' }, 'PIX para Pagamento'), React.createElement('p', { className: 'font-mono font-bold' }, userPixKey || 'Não informada'))
                            )
                        ),
                        React.createElement('div', { className: 'p-4 flex gap-2' },
                            React.createElement('button', { onClick: () => window.print(), className: 'flex-1 bg-yellow-600 text-black font-bold py-2 rounded' }, 'Imprimir'),
                            React.createElement('button', { onClick: onClose, className: 'flex-1 bg-gray-300 py-2 rounded' }, 'Fechar')
                        )
                    )
                )
            );

            if (!isLogged) {
                return React.createElement('div', { className: 'min-h-screen bg-gray-900 flex items-center justify-center p-4 animate-fade-in' },
                    React.createElement('div', { className: 'bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden' },
                        React.createElement('div', { className: 'bg-black p-8 text-center border-b-4 border-yellow-500' },
                            React.createElement('img', { src: 'https://cdn-icons-png.flaticon.com/512/18484/18484449.png', className: 'w-20 h-20 mx-auto mb-4' }),
                            React.createElement('h1', { className: 'text-2xl font-black text-yellow-500 uppercase tracking-tighter' }, 'GESTÃO MASTER'),
                            React.createElement('p', { className: 'text-yellow-600 text-xs font-bold' }, 'Sincronização Ativa em Nuvem')
                        ),
                        React.createElement('div', { className: 'p-8 space-y-6' },
                            !firstAccessMode ? React.createElement(React.Fragment, null,
                                React.createElement('div', null,
                                    React.createElement('label', { className: 'block text-xs font-black text-gray-700 uppercase mb-2' }, 'Login / Usuário'),
                                    React.createElement('input', { id: 'login_field', type: 'text', placeholder: 'Digite seu usuário', className: 'w-full px-4 py-3 border-2 border-gray-100 rounded-xl focus:border-yellow-500 outline-none' })
                                ),
                                React.createElement('div', null,
                                    React.createElement('label', { className: 'block text-xs font-black text-gray-700 uppercase mb-2' }, 'Sua Senha'),
                                    React.createElement('input', { id: 'pass_field', type: 'password', placeholder: '••••••••', className: 'w-full px-4 py-3 border-2 border-gray-100 rounded-xl focus:border-yellow-500 outline-none' })
                                ),
                                React.createElement('button', { onClick: handleLoginAction, className: 'w-full bg-black text-yellow-500 py-4 rounded-xl font-black uppercase tracking-widest hover:bg-gray-800 transition shadow-lg' }, 'Entrar e Sincronizar')
                            ) : React.createElement('div', { className: 'text-center space-y-4 animate-fade-in' },
                                React.createElement('div', { className: 'text-4xl' }, '✨'),
                                React.createElement('h2', { className: 'font-bold text-gray-800' }, 'Primeiro Acesso Detectado'),
                                React.createElement('p', { className: 'text-sm text-gray-500 leading-relaxed' }, 'Este usuário ainda não existe na nuvem. Ao confirmar, seu login e senha serão gravados para que você possa acessar de qualquer dispositivo.'),
