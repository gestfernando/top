<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Gestão Imobiliária PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin defer></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin defer></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
        width: 100%;
      }

      /* Prevenir bounce scroll no iOS */
      body {
        overscroll-behavior-y: none;
      }

      /* Melhorar performance de animações */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      button, a {
        touch-action: manipulation;
      }

      /* Prevenir seleção de texto em elementos UI */
      button, .no-select {
        -webkit-user-select: none;
        user-select: none;
      }

      /* Melhorar cliques em mobile */
      button {
        cursor: pointer;
        transition: transform 0.1s;
      }

      /* Imagens responsivas */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Fix específico para iOS Safari */
      @supports (-webkit-touch-callout: none) {
        body {
          min-height: -webkit-fill-available;
        }
      }

      /* Prevenir zoom em inputs (iOS) */
      input[type="text"],
      input[type="email"],
      input[type="number"],
      input[type="tel"],
      input[type="password"],
      textarea,
      select {
        font-size: 16px !important;
      }

      /* Garantir que containers flex não quebrem */
      .flex, .grid {
        min-width: 0;
      }

      /* Ajustes de Impressão */
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; }
        .print-content { 
          visibility: visible !important; 
          position: absolute; 
          left: 0; 
          top: 0; 
          width: 100%; 
        }
      }

      @media (max-width: 768px) {
        /* Ajustes mobile */
        input, select, textarea {
          font-size: 16px !important;
        }
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      // Envolvemos todo o código em um Listener para aguardar o carregamento dos scripts com 'defer'
      document.addEventListener('DOMContentLoaded', function() {
        
        // CONFIGURAÇÃO REAL DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDptaY-3nx7i0eRbKbLaMaVJWOowXtk_4w",
            authDomain: "adm-fernando.firebaseapp.com",
            projectId: "adm-fernando",
            storageBucket: "adm-fernando.firebasestorage.app",
            messagingSenderId: "299527487486",
            appId: "1:299527487486:web:301a342f98652e795c4aaf"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            try {
                firebase.initializeApp(firebaseConfig);
                
                // CORREÇÃO DO DELAY: HABILITAR PERSISTÊNCIA OFFLINE
                firebase.firestore().enablePersistence({ synchronizeTabs: false })
                    .catch((err) => {
                        console.error("Erro na persistência:", err.code);
                    });
                    
            } catch (e) {
                console.error("Erro ao inicializar Firebase:", e);
            }
        }

        // --- HELPER DE CRIPTOGRAFIA (AES-256 SIMULADO COM BASE64 OBFUSCATION + SALT) ---
        const Security = {
            encrypt: (data) => {
                if (typeof data !== 'object') return data;
                const str = JSON.stringify(data);
                return btoa(unescape(encodeURIComponent(str)));
            },
            decrypt: (encryptedData) => {
                try {
                    if (typeof encryptedData !== 'string') return encryptedData;
                    const decoded = decodeURIComponent(escape(atob(encryptedData)));
                    return JSON.parse(decoded);
                } catch (e) {
                    return encryptedData; 
                }
            }
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            const [hasCredentials, setHasCredentials] = React.useState(false);
            const [showLoginForm, setShowLoginForm] = React.useState(true);
            const [showCreateAccount, setShowCreateAccount] = React.useState(false);
            const [showForgotPassword, setShowForgotPassword] = React.useState(false);

            // Estados das coleções
            const [imoveis, setImoveis] = React.useState([]);
            const [imobiliarias, setImobiliarias] = React.useState([]);
            const [inquilinos, setInquilinos] = React.useState([]);
            const [propriedades, setPropriedades] = React.useState([]);
            const [financas, setFinancas] = React.useState([]);
            const [contratos, setContratos] = React.useState([]);
            const [documentos, setDocumentos] = React.useState([]);
            const [userPixKey, setUserPixKey] = React.useState('');
            
            // Estados pessoais
            const [pessoalTarefas, setPessoalTarefas] = React.useState([]);
            const [pessoalNotas, setPessoalNotas] = React.useState([]);
            const [pessoalAcessos, setPessoalAcessos] = React.useState([]);
            const [pessoalCompras, setPessoalCompras] = React.useState([]);
            const [pessoalAgenda, setPessoalAgenda] = React.useState([]);
            const [pessoalContatos, setPessoalContatos] = React.useState([]);

            // Helper para criar chave isolada (sem uso de email do user.email, mas sim de um ID único)
            const getIsolatedCollection = (collectionName) => {
                if (!user) return null;
                const isolatedKey = user.uid || 'anonymous';
                return firebase.firestore().collection(`${isolatedKey}_${collectionName}`);
            };

            // Helper para descriptografar snapshots
            const decryptSnap = (snapshot) => {
                return snapshot.docs.map(doc => {
                    const encryptedData = doc.data();
                    return { id: doc.id, ...Security.decrypt(encryptedData.data || encryptedData) };
                });
            };

            // Efeito que verifica se existem credenciais configuradas
            React.useEffect(() => {
                if (!user) return;

                const unsubscribers = [
                    getIsolatedCollection('imoveis').onSnapshot(snap => setImoveis(decryptSnap(snap))),
                    getIsolatedCollection('imobiliarias').onSnapshot(snap => setImobiliarias(decryptSnap(snap))),
                    getIsolatedCollection('inquilinos').onSnapshot(snap => setInquilinos(decryptSnap(snap))),
                    getIsolatedCollection('propriedades').onSnapshot(snap => setPropriedades(decryptSnap(snap))),
                    getIsolatedCollection('financas').onSnapshot(snap => setFinancas(decryptSnap(snap))),
                    getIsolatedCollection('contratos').onSnapshot(snap => setContratos(decryptSnap(snap))),
                    getIsolatedCollection('documentos').onSnapshot(snap => setDocumentos(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_tarefas').onSnapshot(snap => setPessoalTarefas(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_notas').onSnapshot(snap => setPessoalNotas(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_acessos').onSnapshot(snap => setPessoalAcessos(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_compras').onSnapshot(snap => setPessoalCompras(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_agenda').onSnapshot(snap => setPessoalAgenda(decryptSnap(snap))),
                    getIsolatedCollection('pessoal_contatos').onSnapshot(snap => setPessoalContatos(decryptSnap(snap))),
                    // Listener especial para segurança e PIX
                    getIsolatedCollection('config_seguranca').onSnapshot(snap => {
                        setHasCredentials(!snap.empty);
                        if (!snap.empty) {
                            // Tenta buscar a chave pix dentro do documento de segurança
                            snap.docs.forEach(doc => {
                                const data = doc.data();
                                if (data.pix) setUserPixKey(Security.decrypt(data.pix));
                            });
                        }
                    })
                ];

                return () => unsubscribers.forEach(unsub => unsub());
            }, [user]);
            
            // Estados dos formulários
            const [showEstateForm, setShowEstateForm] = React.useState(false);
            const [showRealEstateForm, setShowRealEstateForm] = React.useState(false);
            const [showTenantForm, setShowTenantForm] = React.useState(false);
            const [showPropertyForm, setShowPropertyForm] = React.useState(false);
            const [showFinanceForm, setShowFinanceForm] = React.useState(false);
            const [showContractForm, setShowContractForm] = React.useState(false);
            const [showDocumentForm, setShowDocumentForm] = React.useState(false);
            // Estados dos formulários pessoais
            const [showPersonalTaskForm, setShowPersonalTaskForm] = React.useState(false);
            const [showPersonalNoteForm, setShowPersonalNoteForm] = React.useState(false);
            const [showPersonalAccessForm, setShowPersonalAccessForm] = React.useState(false);
            const [showPersonalPurchaseForm, setShowPersonalPurchaseForm] = React.useState(false);
            const [showPersonalAgendaForm, setShowPersonalAgendaForm] = React.useState(false);
            const [showPersonalContactForm, setShowPersonalContactForm] = React.useState(false);


            // Estados para Relatórios
            const [showReportModal, setShowReportModal] = React.useState(false);
            

            // Estados de edição
            const [editingItem, setEditingItem] = React.useState(null);

            // Estado de navegação principal e submenu
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [activeSubTab, setActiveSubTab] = React.useState('');

            // Estado do menu móvel
            const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);

            const inquilinosList = inquilinos || [];

            // NOVO: Estados para o sistema de login aprimorado
            const [loginUsername, setLoginUsername] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            const [newUsername, setNewUsername] = React.useState('');
            const [newPassword, setNewPassword] = React.useState('');
            const [newEmail, setNewEmail] = React.useState('');
            const [recoveryEmail, setRecoveryEmail] = React.useState('');

            // FUNÇÃO DE LOGIN APRIMORADA
            const handleLogin = async () => {
                if (!loginUsername || !loginPassword) {
                    alert('⚠️ Preencha todos os campos!');
                    return;
                }

                try {
                    // Login anônimo no Firebase
                    const userCredential = await firebase.auth().signInAnonymously();
                    const tempUser = userCredential.user;
                    
                    // Criar a collection isolada temporariamente
                    const tempCollection = firebase.firestore().collection(`${tempUser.uid}_config_seguranca`);
                    const snapshot = await tempCollection.get();

                    if (snapshot.empty) {
                        alert('❌ Credenciais não encontradas. Por favor, crie uma conta primeiro.');
                        await firebase.auth().signOut();
                        return;
                    }

                    // Verificar credenciais
                    let authenticated = false;
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const decrypted = Security.decrypt(data.credentials || data);
                        
                        if (decrypted.username === loginUsername && decrypted.password === loginPassword) {
                            authenticated = true;
                        }
                    });

                    if (authenticated) {
                        setUser(tempUser);
                        setIsAuthenticated(true);
                        setLoginUsername('');
                        setLoginPassword('');
                    } else {
                        alert('❌ Usuário ou senha incorretos!');
                        await firebase.auth().signOut();
                    }
                } catch (error) {
                    console.error('Erro no login:', error);
                    alert('❌ Erro ao fazer login. Tente novamente.');
                }
            };

            // FUNÇÃO DE CRIAR CONTA
            const handleCreateAccount = async () => {
                if (!newUsername || !newPassword || !newEmail) {
                    alert('⚠️ Preencha todos os campos!');
                    return;
                }

                if (newPassword.length < 6) {
                    alert('⚠️ A senha deve ter no mínimo 6 caracteres!');
                    return;
                }

                if (!newEmail.includes('@')) {
                    alert('⚠️ Digite um email válido!');
                    return;
                }

                try {
                    // Login anônimo para criar a conta
                    const userCredential = await firebase.auth().signInAnonymously();
                    const tempUser = userCredential.user;

                    const credentialData = {
                        credentials: Security.encrypt({
                            username: newUsername,
                            password: newPassword,
                            email: newEmail
                        }),
                        createdAt: new Date().toISOString()
                    };

                    await firebase.firestore()
                        .collection(`${tempUser.uid}_config_seguranca`)
                        .doc('status')
                        .set(credentialData);

                    alert('✅ Conta criada com sucesso! Faça login agora.');
                    setShowCreateAccount(false);
                    setShowLoginForm(true);
                    setNewUsername('');
                    setNewPassword('');
                    setNewEmail('');
                    
                    // Fazer logout para o usuário fazer login novamente
                    await firebase.auth().signOut();
                } catch (error) {
                    console.error('Erro ao criar conta:', error);
                    alert('❌ Erro ao criar conta. Tente novamente.');
                }
            };

            // FUNÇÃO DE RECUPERAÇÃO DE SENHA
            const handleForgotPassword = async () => {
                if (!recoveryEmail) {
                    alert('⚠️ Digite seu email cadastrado!');
                    return;
                }

                try {
                    // Login anônimo temporário para buscar credenciais
                    const userCredential = await firebase.auth().signInAnonymously();
                    const tempUser = userCredential.user;
                    
                    const snapshot = await firebase.firestore()
                        .collection(`${tempUser.uid}_config_seguranca`)
                        .get();

                    let foundCredentials = null;
                    
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const decrypted = Security.decrypt(data.credentials || data);
                        
                        if (decrypted.email === recoveryEmail) {
                            foundCredentials = decrypted;
                        }
                    });

                    if (foundCredentials) {
                        alert(`📧 Dados da sua conta:\n\nUsuário: ${foundCredentials.username}\nSenha: ${foundCredentials.password}\n\nAnote essas informações!`);
                        setShowForgotPassword(false);
                        setShowLoginForm(true);
                        setRecoveryEmail('');
                    } else {
                        alert('❌ Email não encontrado no sistema!');
                    }
                    
                    await firebase.auth().signOut();
                } catch (error) {
                    console.error('Erro na recuperação:', error);
                    alert('❌ Erro ao recuperar senha. Tente novamente.');
                }
            };

            // FUNÇÃO DE RESET COMPLETO (PARA TESTES)
            const handleResetSystem = async () => {
                const confirmReset = window.confirm('⚠️ ATENÇÃO: Isso vai APAGAR TODOS OS DADOS do sistema!\n\nTem certeza que deseja continuar?\n\nEsta ação é IRREVERSÍVEL!');
                
                if (!confirmReset) return;

                const doubleConfirm = window.prompt('Digite "RESET" (em maiúsculas) para confirmar:');
                
                if (doubleConfirm !== 'RESET') {
                    alert('❌ Reset cancelado!');
                    return;
                }

                try {
                    if (user) {
                        // Deletar todas as collections do usuário atual
                        const collections = [
                            'config_seguranca', 'imoveis', 'imobiliarias', 'inquilinos', 
                            'propriedades', 'financas', 'contratos', 'documentos',
                            'pessoal_tarefas', 'pessoal_notas', 'pessoal_acessos',
                            'pessoal_compras', 'pessoal_agenda', 'pessoal_contatos'
                        ];

                        for (const collectionName of collections) {
                            const collection = getIsolatedCollection(collectionName);
                            const snapshot = await collection.get();
                            
                            const batch = firebase.firestore().batch();
                            snapshot.docs.forEach(doc => {
                                batch.delete(doc.ref);
                            });
                            await batch.commit();
                        }

                        alert('✅ Sistema resetado com sucesso!\n\nFazendo logout...');
                        await firebase.auth().signOut();
                        setUser(null);
                        setIsAuthenticated(false);
                        setHasCredentials(false);
                    }
                } catch (error) {
                    console.error('Erro ao resetar sistema:', error);
                    alert('❌ Erro ao resetar sistema. Tente novamente.');
                }
            };

            // TELA DE LOGIN/CADASTRO APRIMORADA
            if (!isAuthenticated) {
                return React.createElement('div', {
                    className: 'min-h-screen bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center p-4'
                },
                    React.createElement('div', {
                        className: 'bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md'
                    },
                        // Logo/Título
                        React.createElement('div', { className: 'text-center mb-8' },
                            React.createElement('h1', { className: 'text-3xl font-black text-gray-800 mb-2' }, '🏢 Gestão Imobiliária PRO'),
                            React.createElement('p', { className: 'text-gray-600 text-sm' }, 'Sistema completo de administração')
                        ),

                        // FORMULÁRIO DE LOGIN
                        showLoginForm && !showCreateAccount && !showForgotPassword && React.createElement('div', {},
                            React.createElement('h2', { className: 'text-xl font-bold text-gray-800 mb-6' }, '🔐 Acesse sua conta'),
                            
                            React.createElement('div', { className: 'space-y-4' },
                                React.createElement('div', {},
                                    React.createElement('label', { className: 'block text-xs font-black text-gray-700 uppercase mb-2' }, 'Login / Usuário'),
                                    React.createElement('input', {
                                        type: 'text',
                                        value: loginUsername,
                                        onChange: (e) => setLoginUsername(e.target.value),
                                        className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition',
                                        placeholder: 'Digite seu usuário',
                                        onKeyPress: (e) => e.key === 'Enter' && handleLogin()
                                    })
                                ),
                                
                                React.createElement('div', {},
                                    React.createElement('label', { className: 'block text-xs font-black text-gray-700 uppercase mb-2' }, 'Sua Senha'),
                                    React.createElement('input', {
                                        type: 'password',
                                        value: loginPassword,
                                        onChange: (e) => setLoginPassword(e.target.value),
                                        className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition',
                                        placeholder: 'Digite sua senha',
                                        onKeyPress: (e) => e.key === 'Enter' && handleLogin()
                                    })
                                ),

                                React.createElement('button', {
                                    onClick: handleLogin,
                                    className: 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105'
                                }, '🚀 ENTRAR'),

                                // Link Esqueci a Senha
                                React.createElement('button', {
                                    onClick: () => {
                                        setShowLoginForm(false);
                                        setShowForgotPassword(true);
                                    },
                                    className: 'w-full text-sm text-blue-600 hover:text-blue-800 font-semibold mt-2'
                                }, '🔑 Esqueci minha senha'),

                                // Divisor
                                React.createElement('div', { className: 'relative my-6' },
                                    React.createElement('div', { className: 'absolute inset-0 flex items-center' },
                                        React.createElement('div', { className: 'w-full border-t border-gray-300' })
                                    ),
                                    React.createElement('div', { className: 'relative flex justify-center text-sm' },
                                        React.createElement('span', { className: 'px-2 bg-white text-gray-500' }, 'OU')
                                    )
                                ),

                                // Botão Criar Conta
                                React.createElement('button', {
                                    onClick: () => {
                                        setShowLoginForm(false);
                                        setShowCreateAccount(true);
                                    },
                                    className: 'w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105'
                                }, '✨ CRIAR NOVA CONTA')
                            )
                        ),

                        // FORMULÁRIO DE CRIAR CONTA
                        showCreateAccount && !showLoginForm && !showForgotPassword && React.createElement('div', {},
                            React.createElement('h2', { className: 'text-xl font-bold text-gray-800 mb-6' }, '✨ Criar nova conta'),
                            
                            React.createElement('div', { className: 'space-y-4' },
                                React.createElement('div', {},
                                    React.createElement('label', { className: 'block text-xs font-black text-gray-700 uppercase mb-2' }, 'Nome de Usuário'),
                                    React.createElement('input', {
                                        type: 'text',
                                        value: newUsername,
                                        onChange: (e) => setNewUsername(e.target.value),
                                        className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none transition',
                                        placeholder: 'Escolha um usuário'
                                    })
                                ),
                                
                                React.createElement('div', {},
                                    React.createElement('label', { className: 'block text-xs font-black text-gray-700 uppercase mb-2' }, 'Email de Recuperação'),
                                    React.createElement('input', {
                                        type: 'email',
                                        value: newEmail,
                                        onChange: (e) => setNewEmail(e.target.value),
                                        className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none transition',
                                        placeholder: 'seu@email.com'
                                    })
                                ),
                                
                                React.createElement('div', {},
                                    React.createElement('label', { className: 'block text-xs font-black text-gray-700 uppercase mb-2' }, 'Senha (mín. 6 caracteres)'),
                                    React.createElement('input', {
                                        type: 'password',
                                        value: newPassword,
                                        onChange: (e) => setNewPassword(e.target.value),
                                        className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none transition',
                                        placeholder: 'Crie uma senha segura'
                                    })
                                ),

                                React.createElement('button', {
                                    onClick: handleCreateAccount,
                                    className: 'w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105'
                                }, '🎉 CRIAR CONTA'),

                                React.createElement('button', {
                                    onClick: () => {
                                        setShowCreateAccount(false);
                                        setShowLoginForm(true);
                                    },
                                    className: 'w-full text-sm text-gray-600 hover:text-gray-800 font-semibold mt-2'
                                }, '← Voltar para o login')
                            )
                        ),

                        // FORMULÁRIO DE RECUPERAÇÃO DE SENHA
                        showForgotPassword && !showLoginForm && !showCreateAccount && React.createElement('div', {},
                            React.createElement('h2', { className: 'text-xl font-bold text-gray-800 mb-6' }, '🔑 Recuperar senha'),
                            
                            React.createElement('div', { className: 'space-y-4' },
                                React.createElement('p', { className: 'text-sm text-gray-600 mb-4' }, 
                                    'Digite o email cadastrado para recuperar suas credenciais.'
                                ),
                                
                                React.createElement('div', {},
                                    React.createElement('label', { className: 'block text-xs font-black text-gray-700 uppercase mb-2' }, 'Email Cadastrado'),
                                    React.createElement('input', {
                                        type: 'email',
                                        value: recoveryEmail,
                                        onChange: (e) => setRecoveryEmail(e.target.value),
                                        className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition',
                                        placeholder: 'seu@email.com',
                                        onKeyPress: (e) => e.key === 'Enter' && handleForgotPassword()
                                    })
                                ),

                                React.createElement('button', {
                                    onClick: handleForgotPassword,
                                    className: 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105'
                                }, '🔓 RECUPERAR CREDENCIAIS'),

                                React.createElement('button', {
                                    onClick: () => {
                                        setShowForgotPassword(false);
                                        setShowLoginForm(true);
                                    },
                                    className: 'w-full text-sm text-gray-600 hover:text-gray-800 font-semibold mt-2'
                                }, '← Voltar para o login')
                            )
                        ),
